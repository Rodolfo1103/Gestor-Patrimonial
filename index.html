function mkL(cu){
  const ccy={...BCCY},cls={},lbl={...NAMES};
  Object.entries(BASE).forEach(([cid,ts])=>ts.forEach(t=>{cls[t]=cid;}));
  Object.entries(cu||{}).forEach(([cid,list])=>{
    (list||[]).forEach(a=>{ccy[a.ticker]=a.ccy||"BRL";cls[a.ticker]=cid;lbl[a.ticker]=a.label||a.ticker;});
  });
  return {ccy,cls,lbl};
}
function pv(t,p,ccy){
  if(!p)return 0;
  if(VB.includes(t))return p.totalBRL||0;
  if(GB.includes(t))return(p.qty||0)*(p.price||0);
  return(p.qty||0)*(p.price||0)*(FX[ccy[t]||"BRL"]||1);
}
function hq(t,p){if(!p)return false;if(VB.includes(t))return(p.totalBRL||0)>0;return(p.qty||0)>0;}
const fB=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fN=(v,d=2)=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=v=>(v||0).toFixed(1)+"%";
const pN=s=>parseFloat(String(s).replace(",","."))||0;

async function callAPI(messages,key){
  const body={model:"claude-sonnet-4-5",max_tokens:1500,messages};
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||d.error.type);
  return d.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
}

// SVG helpers
function AllocChart({cw}){
  const W=300,H=155,pL=30,pB=42,pT=14,pR=8,cW=W-pL-pR,cH=H-pB-pT;
  const mx=Math.max(35,...CL.map(c=>(cw[c.id]||0)*1.15));
  const bW=Math.floor(cW/CL.length)-3;
  return h("div",{style:{marginBottom:20}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Alocacao atual vs alvo"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",overflow:"hidden"}},
      ...[0,10,20,30].filter(v=>v<=mx).map(v=>{
        const y=pT+cH-(v/mx)*cH;
        return h(Fragment,{key:v},h("line",{x1:pL,y1:y,x2:W-pR,y2:y,stroke:"rgba(255,255,255,0.05)",strokeWidth:"1"}),h("text",{x:pL-2,y:y+3,textAnchor:"end",fill:"#5A5550",fontSize:"6"},v+"%"));
      }),
      ...CL.map((c,i)=>{
        const w=cw[c.id]||0,sW=cW/CL.length,x=pL+i*sW+(sW-bW)/2;
        const bH=Math.max((w/mx)*cH,1),y=pT+cH-bH;
        const st=w<c.min?"u":w>c.max?"o":"k";
        const fill=st==="u"?"#E05252":st==="o"?"#E8C44A":c.color;
        const xm=x+bW/2,yMin=pT+cH-(c.min/mx)*cH;
        return h(Fragment,{key:c.id},
          h("line",{x1:xm-bW*.5,y1:yMin,x2:xm+bW*.5,y2:yMin,stroke:c.color,strokeWidth:"1",strokeOpacity:".4",strokeDasharray:"2,2"}),
          h("rect",{x,y,width:bW,height:bH,fill,fillOpacity:".85",rx:"2"}),
          h("text",{x:xm,y:y-2,textAnchor:"middle",fill,fontSize:"6",fontFamily:"monospace"},w.toFixed(1)),
          h("text",{x:xm,y:H-pB+13,textAnchor:"middle",fill:c.color,fontSize:"8"},c.tag),
          h("text",{x:xm,y:H-pB+24,textAnchor:"middle",fill:"#6A6050",fontSize:"5.5",fontFamily:"monospace"},c.min+"-"+c.max+"%")
        );
      }),
      h("line",{x1:pL,y1:pT+cH,x2:W-pR,y2:pT+cH,stroke:"rgba(255,255,255,0.08)",strokeWidth:"1"})
    )
  );
}

function DonutChart({cw}){
  const W=300,H=195,R=58,r=36;
  function slices(data,cx,cy){
    let angle=-Math.PI/2;
    return data.map(({pct,color},i)=>{
      const a=pct/100*2*Math.PI;
      if(pct<0.3)return null;
      const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
      const x2=cx+R*Math.cos(angle+a),y2=cy+R*Math.sin(angle+a);
      const x3=cx+r*Math.cos(angle+a),y3=cy+r*Math.sin(angle+a);
      const x4=cx+r*Math.cos(angle),y4=cy+r*Math.sin(angle);
      const lg=a>Math.PI?1:0;
      const path="M "+x1+" "+y1+" A "+R+" "+R+" 0 "+lg+" 1 "+x2+" "+y2+" L "+x3+" "+y3+" A "+r+" "+r+" 0 "+lg+" 0 "+x4+" "+y4+" Z";
      angle+=a;
      return h("path",{key:i,d:path,fill:color,fillOpacity:0.88});
    });
  }
  const actual=CL.map(c=>({pct:cw[c.id]||0,color:c.color}));
  const target=CL.map(c=>({pct:(c.min+c.max)/2,color:c.color}));
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:6}},"Atual vs Alvo"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
      ...slices(actual,75,88),
      h("text",{x:75,y:82,textAnchor:"middle",fill:"#C8A96E",fontSize:"8",fontFamily:"monospace"},"ATUAL"),
      h("text",{x:75,y:96,textAnchor:"middle",fill:"#F0EAD8",fontSize:"9",fontFamily:"monospace",fontWeight:"bold"},"atual"),
      ...slices(target,225,88),
      h("text",{x:225,y:82,textAnchor:"middle",fill:"#C8A96E",fontSize:"8",fontFamily:"monospace"},"ALVO"),
      h("text",{x:225,y:96,textAnchor:"middle",fill:"#F0EAD8",fontSize:"9",fontFamily:"monospace",fontWeight:"bold"},"meta"),
      ...CL.map((c,i)=>{
        const lx=10+(i%4)*72,ly=H-30+Math.floor(i/4)*14;
        return h(Fragment,{key:c.id},
          h("rect",{x:lx,y:ly,width:7,height:7,fill:c.color,rx:"1"}),
          h("text",{x:lx+10,y:ly+6,fill:"#7A7060",fontSize:"6.5",fontFamily:"monospace"},c.tag+" "+pc(cw[c.id]||0))
        );
      })
    )
  );
}

function RiskChart({cw}){
  const W=300,H=170,pL=22,pB=20,pT=12,pR=12,cW=W-pL-pR,cH=H-pB-pT;
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Risco x Retorno esperado"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:6,fontStyle:"italic"}},"Tamanho do circulo = peso no portfolio"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
      ...[0,2,4,6,8,10].map(v=>{
        const x=pL+(v/10)*cW,y=pT+cH-(v/10)*cH;
        return h(Fragment,{key:v},h("line",{x1:x,y1:pT,x2:x,y2:pT+cH,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}),h("line",{x1:pL,y1:y,x2:pL+cW,y2:y,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}));
      }),
      h("text",{x:pL+cW/2,y:H-3,textAnchor:"middle",fill:"#4A4840",fontSize:"7"},"risco ->"),
      ...CL.map(c=>{
        const p=RR[c.id];if(!p)return null;
        const w=cw[c.id]||0,cx=pL+(p.r/10)*cW,cy=pT+cH-(p.e/10)*cH;
        const r=w>0?Math.max(Math.sqrt(w)*3.2,7):4,op=w>0?.9:.15;
        return h(Fragment,{key:c.id},
          h("circle",{cx,cy,r,fill:c.color,fillOpacity:op,stroke:c.color,strokeWidth:"1.5",strokeOpacity:op}),
          w>0&&h("text",{x:cx,y:cy+3,textAnchor:"middle",fill:"#0D0F14",fontSize:"6.5",fontWeight:"bold"},w.toFixed(0)+"%"),
          w>0&&h("text",{x:cx,y:cy-r-3,textAnchor:"middle",fill:c.color,fontSize:"8"},c.tag)
        );
      }),
      h("line",{x1:pL,y1:pT+cH,x2:pL+cW,y2:pT+cH,stroke:"rgba(255,255,255,0.1)",strokeWidth:"1"}),
      h("line",{x1:pL,y1:pT,x2:pL,y2:pT+cH,stroke:"rgba(255,255,255,0.1)",strokeWidth:"1"})
    )
  );
}

function EvolChart({hist,showUSD,setShowUSD}){
  const data=hist.filter(r=>r.totalPatrimBRL>0);
  const empty=h("div",{style:{padding:"14px",textAlign:"center",color:"#5A5550",fontSize:11,fontStyle:"italic",border:"1px solid rgba(255,255,255,0.05)",borderRadius:8}},"Disponivel apos 2+ aportes registrados");
  const toggler=h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
    h("button",{onClick:()=>setShowUSD(false),style:{fontSize:9,padding:"3px 10px",borderRadius:4,fontFamily:"monospace",background:!showUSD?"#C8A96E":"transparent",border:"1px solid rgba(200,169,110,0.4)",color:!showUSD?"#0D0F14":"#8A8070",cursor:"pointer"}},"BRL"),
    h("button",{onClick:()=>setShowUSD(true),style:{fontSize:9,padding:"3px 10px",borderRadius:4,fontFamily:"monospace",background:showUSD?"#5B8FD4":"transparent",border:"1px solid rgba(91,143,212,0.4)",color:showUSD?"#0D0F14":"#8A8070",cursor:"pointer"}},"USD")
  );
  if(data.length<2)return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:8}},"Evolucao do patrimonio"),
    toggler,empty
  );
  const vals=data.map(r=>showUSD?(r.totalPatrimUSD||r.totalPatrimBRL/FX.USD):r.totalPatrimBRL);
  const minV=Math.min(...vals)*0.95,maxV=Math.max(...vals)*1.02,rng=maxV-minV||1;
  const W=300,H=155,pL=44,pB=26,pT=12,pR=10,cW=W-pL-pR,cH=H-pB-pT;
  const pts=vals.map((v,i)=>({x:pL+(i/(vals.length-1))*cW,y:pT+cH-((v-minV)/rng)*cH,v}));
  const lineD=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const areaD=lineD+" L"+pts[pts.length-1].x.toFixed(1)+" "+(pT+cH)+" L"+pts[0].x.toFixed(1)+" "+(pT+cH)+" Z";
  const lc=showUSD?"#5B8FD4":"#C8A96E";
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:8}},"Evolucao do patrimonio"),
    toggler,
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
      h("defs",{},h("linearGradient",{id:"lg1",x1:"0",y1:"0",x2:"0",y2:"1"},
        h("stop",{offset:"0%",stopColor:lc,stopOpacity:"0.2"}),
        h("stop",{offset:"100%",stopColor:lc,stopOpacity:"0.02"})
      )),
      h("path",{d:areaD,fill:"url(#lg1)"}),
      ...[0,0.5,1].map(f=>{
        const y=pT+cH-(f*cH),v=minV+f*rng;
        const label=showUSD?"$"+(v/1000).toFixed(0)+"k":"R$"+(v/1000).toFixed(0)+"k";
        return h(Fragment,{key:f},h("line",{x1:pL,y1:y,x2:W-pR,y2:y,stroke:"rgba(255,255,255,0.05)",strokeWidth:"1"}),h("text",{x:pL-3,y:y+3,textAnchor:"end",fill:"#5A5550",fontSize:"7"},label));
      }),
      h("path",{d:lineD,fill:"none",stroke:lc,strokeWidth:"2",strokeLinejoin:"round"}),
      ...pts.map((p,i)=>h("circle",{key:i,cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:"3",fill:lc,stroke:"#0D0F14",strokeWidth:"1.5"})),
      ...data.map((r,i)=>{
        const x=pL+(i/(data.length-1))*cW;
        const lb=new Date(r.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
        return h("text",{key:i,x:x.toFixed(1),y:H-pB+12,textAnchor:"middle",fill:"#5A5550",fontSize:"6.5"},lb);
      }),
      h("text",{x:pts[pts.length-1].x.toFixed(1),y:(pts[pts.length-1].y-8).toFixed(1),textAnchor:"middle",fill:lc,fontSize:"8",fontFamily:"monospace",fontWeight:"bold"},
        showUSD?("$"+(vals[vals.length-1]/1000).toFixed(1)+"k"):("R$"+(vals[vals.length-1]/1000).toFixed(0)+"k")
      )
    )
  );
}

function KeyScreen({onSave}){

  return h("div",{style:{minHeight:"100vh",background:"#0D0F14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}},

    h("p",{style:{color:"#8A8070",fontSize:13,lineHeight:1.7,marginBottom:20,textAlign:"center",maxWidth:320}},
      "Obtenha em ",h("span",{style:{color:"#C8A96E"}},"console.anthropic.com"),". Salva so neste dispositivo."
    ),
    h("input",{type:"text",placeholder:"sk-ant-...",value:v,onChange:e=>sv(e.target.value),autoComplete:"off",autoCapitalize:"off",spellCheck:false,style:{width:"100%",maxWidth:320,background:"rgba(200,169,110,0.05)",border:"1px solid rgba(200,169,110,0.3)",borderRadius:8,padding:"12px 14px",color:"#F0EAD8",fontFamily:"monospace",outline:"none",marginBottom:10}}),
    h("button",{onClick:()=>v.length>20?onSave(v):alert("Cole a chave completa (sk-ant-...)"),style:{width:"100%",maxWidth:320,padding:"13px",background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,color:"#0D0F14",fontSize:13,fontWeight:700,cursor:"pointer"}},"Salvar e continuar")
  );

        ...chatM.map((m,i)=>h("div",{key:i,style:{display:"flex",flexDirection:"column",alignItems:m.role==="user"?"flex-end":"flex-start",marginBottom:10}},h("div",{style:{maxWidth:"88%",padding:"9px 12px",background:m.role==="user"?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.04)",border:"1px solid "+(m.role==="user"?"rgba(200,169,110,0.25)":"rgba(255,255,255,0.07)"),borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px"}},h("div",{style:{fontSize:12,color:m.role==="user"?"#F0EAD8":"#C8C0B0",lineHeight:1.7,whiteSpace:"pre-wrap"}},m.content)),h("div",{style:{fontSize:9,color:"#3A3830",marginTop:2,fontFamily:"monospace"}},m.role==="user"?"voce":"analista"))),
        chatL&&h("div",{className:"dp",style:{padding:"10px 12px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"12px 12px 12px 4px",display:"inline-flex",marginBottom:10}},h("span"),h("span"),h("span")),
        h("div",{ref:endRef})
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"flex-end",background:"rgba(0,0,0,0.3)",border:"1px solid rgba(200,169,110,0.2)",borderRadius:12,padding:"8px 10px"}},
        h("textarea",{value:chatIn,onChange:e=>setChatIn(e.target.value),onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(chatIn.trim())sendChat(chatIn);}},placeholder:"Questione uma recomendacao ou peca analise...",rows:2,style:{flex:1,background:"transparent",border:"none",outline:"none",color:"#F0EAD8",fontSize:13,resize:"none",lineHeight:1.5,maxHeight:80}}),
        h("button",{onClick:()=>{if(chatIn.trim())sendChat(chatIn);},disabled:chatL||!chatIn.trim(),style:{flexShrink:0,width:36,height:36,background:chatL||!chatIn.trim()?"rgba(200,169,110,0.1)":"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,cursor:chatL||!chatIn.trim()?"not-allowed":"pointer",color:"#0D0F14",fontSize:16}},"^")
      )
    );
  }

  // HISTORY
  if(tab==="history"){
    content=h("div",{},
      h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:12}},"Aportes executados"),
      hist.length===0?h("div",{style:{textAlign:"center",padding:"40px 0",color:"#5A5550",fontStyle:"italic"}},"Nenhum aporte registrado."):
      h("div",{},...hist.map((rec,i)=>h("div",{key:i,style:{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"11px 13px",marginBottom:7}},
        h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},h("span",{style:{fontSize:9,color:"#8A8070",fontFamily:"monospace"}},new Date(rec.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"})),h("span",{style:{fontFamily:"monospace",fontSize:12,color:"#C8A96E",fontWeight:700}},MV(fB(rec.totalExecuted)))),
        ...rec.purchases.map((p,j)=>{const cl3=CL.find(c=>c.id===(cls[p.ticker]||""));return h("div",{key:j,style:{display:"flex",alignItems:"center",gap:6,padding:"3px 0",borderTop:"1px solid rgba(255,255,255,0.03)"}},h("div",{style:{width:4,height:4,borderRadius:"50%",background:cl3?cl3.color:"#888",flexShrink:0}}),h("span",{style:{fontFamily:"monospace",fontSize:10,color:"#F0EAD8",flex:1}},p.ticker),h("span",{style:{fontSize:9,color:"#8A8070",fontFamily:"monospace"}},fN(p.qty,p.qty<100?4:0)+" x "+fN(p.price,2)),h("span",{style:{fontFamily:"monospace",fontSize:10,color:"#B0A890"}},MV(fB(p.total))));})
      )))
    );
  }

  return h("div",{style:{minHeight:"100vh",background:"#0D0F14",color:"#E8E2D5",fontFamily:"Georgia,serif",paddingBottom:80}},
    header,
    h("div",{style:{padding:"0 18px"}},tabs,content)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
