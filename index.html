                ),

                // ===== ESCALA DE BANDAS DE CORRELACAO COM INDICADOR =====
                (()=>{
                  // Bandas de correlacao (intervalos)
                  const bandas=[
                    {min:-1.0,max:-0.5,nome:"FORTE NEGATIVA",cor:"#1F8A78",bg:"rgba(31,138,120,0.50)",interp:"Otima diversificacao - movimentos opostos"},
                    {min:-0.5,max:-0.2,nome:"MODERADA NEG.",cor:"#4CAF82",bg:"rgba(76,175,130,0.40)",interp:"Excelente diversificacao"},
                    {min:-0.2,max:0.0,nome:"BAIXA NEG.",cor:"#7DD17D",bg:"rgba(125,209,125,0.35)",interp:"Boa diversificacao"},
                    {min:0.0,max:0.2,nome:"NEUTRA",cor:"#C8A96E",bg:"rgba(200,169,110,0.30)",interp:"Diversificacao adequada"},
                    {min:0.2,max:0.4,nome:"BAIXA POS.",cor:"#E8C44A",bg:"rgba(232,196,74,0.35)",interp:"Diversificacao limitada"},
                    {min:0.4,max:0.7,nome:"MODERADA POS.",cor:"#E89060",bg:"rgba(232,144,96,0.40)",interp:"Risco de concentracao"},

                  ];

                  // Identifica banda do portfolio
                  const bandaPort=bandas.find(b=>corrMediaPond>=b.min&&corrMediaPond<=b.max)||bandas[3];

                  // Calcula posicao percentual na escala [-1, +1] -> [0%, 100%]
                  const posPct=Math.max(0,Math.min(100,(corrMediaPond+1)/2*100));

                  return h("div",{style:{background:"rgba(0,0,0,0.20)",borderRadius:6,padding:"10px 12px"}},
                    h("div",{style:{fontSize:8,letterSpacing:1.5,color:"#8A8070",fontFamily:"monospace",fontWeight:700,marginBottom:8}},"\u{1F3AF} BANDA DE CORRELACAO DO PORTFOLIO"),

                    // Barra das bandas
                    h("div",{style:{position:"relative",height:24,borderRadius:4,overflow:"hidden",display:"flex",marginBottom:6}},
                      ...bandas.map((b,i)=>{
                        const wPct=((b.max-b.min)/2)*100;// largura percentual da banda
                        return h("div",{key:"bnd"+i,style:{width:wPct+"%",background:b.bg,display:"flex",alignItems:"center",justifyContent:"center",borderRight:i<bandas.length-1?"1px solid rgba(0,0,0,0.3)":"none"}});
                      })
                    ),

                    // Indicador do portfolio (triangulo apontando para cima + valor)
                    h("div",{style:{position:"relative",height:28,marginBottom:6}},
                      // Linha vertical do indicador
                      h("div",{style:{position:"absolute",left:"calc("+posPct+"% - 1px)",top:-31,width:2,height:30,background:"#FFF",boxShadow:"0 0 4px rgba(255,255,255,0.6)"}}),
                      // Triangulo apontando para cima
                      h("div",{style:{position:"absolute",left:"calc("+posPct+"% - 6px)",top:-2,width:0,height:0,borderLeft:"6px solid transparent",borderRight:"6px solid transparent",borderBottom:"8px solid #FFF",filter:"drop-shadow(0 0 3px rgba(255,255,255,0.6))"}}),
                      // Label do valor abaixo do indicador
                      h("div",{style:{position:"absolute",left:"calc("+posPct+"% - 35px)",top:10,width:70,textAlign:"center",fontSize:9,color:"#FFF",fontFamily:"monospace",fontWeight:700,background:"rgba(0,0,0,0.7)",borderRadius:3,padding:"2px 4px",border:"1px solid "+bandaPort.cor}},corrMediaPond.toFixed(3))
                    ),

                    // Marcadores -1, 0, +1
                    h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:7,color:"#6A6050",fontFamily:"monospace",marginBottom:8}},

                      h("span",{},"-0.2"),
                      h("span",{style:{color:"#C8A96E",fontWeight:700}},"0.0"),

                      h("span",{},"+0.4"),
                      h("span",{},"+0.7"),
                      h("span",{},"+1.0")
                    ),

                    // Legenda das bandas (chips)
                    h("div",{style:{display:"flex",flexWrap:"wrap",gap:3,marginBottom:9}},
                      ...bandas.map((b,i)=>{
                        const isAtual=b===bandaPort;
                        return h("div",{key:"chip"+i,style:{fontSize:7,fontFamily:"monospace",fontWeight:isAtual?700:400,padding:"3px 6px",background:isAtual?b.bg:"transparent",border:"1px solid "+(isAtual?b.cor:"rgba(255,255,255,0.06)"),borderRadius:3,color:isAtual?"#FFF":b.cor,letterSpacing:0.5,boxShadow:isAtual?"0 0 5px "+b.cor+"66":"none"}},

    // ===== SHARPE/SORTINO HISTORICO (baseado em retornos mensais reais do portfolio) =====
    // Diferente do Sharpe modelo (que usa premissas), estes usam DADOS REAIS dos ultimos 12 meses
    let sharpeHist=null,sortinoHist=null,retAnualHist=null,volAnualHist=null,volDownAnualHist=null,nMesesHist=0;

        const ultimos=snapsHist.slice(-13);

        for(let i=1;i<ultimos.length;i++){
          const ant=ultimos[i-1],atu=ultimos[i];
          if(!ant.totalPatrimBRL||!atu.totalPatrimBRL)continue;
          const aporte=atu.apValue||0;
          // Retorno = (Vfinal - Aporte) / Vinicial - 1
          const ret=(atu.totalPatrimBRL-aporte)/ant.totalPatrimBRL-1;
          if(!isNaN(ret)&&isFinite(ret)){
            retornosMensais.push(ret);
          }
        }
        nMesesHist=retornosMensais.length;
        if(nMesesHist>=3){
          // Retorno medio mensal e anualizado
          const retMedioMes=retornosMensais.reduce((s,r)=>s+r,0)/nMesesHist;
          retAnualHist=Math.pow(1+retMedioMes,12)-1;// composto anual
          // Volatilidade mensal (desvio padrao) e anualizada
          const variancia=retornosMensais.reduce((s,r)=>s+Math.pow(r-retMedioMes,2),0)/nMesesHist;
          const volMes=Math.sqrt(variancia);
          volAnualHist=volMes*Math.sqrt(12);
          // Volatilidade Downside (so retornos abaixo do alvo = 0, ou seja, retornos negativos)
          const downsideRets=retornosMensais.filter(r=>r<0);
          if(downsideRets.length>0){
            const downsideVariancia=downsideRets.reduce((s,r)=>s+Math.pow(r,2),0)/nMesesHist;// nota: divide por n total (Sortino classico)
            const volDownMes=Math.sqrt(downsideVariancia);
            volDownAnualHist=volDownMes*Math.sqrt(12);
          }
          // Sharpe e Sortino
          const excessoAnual=retAnualHist-rfAtual;
          if(volAnualHist>0)sharpeHist=excessoAnual/volAnualHist;
          if(volDownAnualHist&&volDownAnualHist>0)sortinoHist=excessoAnual/volDownAnualHist;
          else if(downsideRets.length===0)sortinoHist=Infinity;// nenhum retorno negativo no periodo
        }

              h("div",{style:{fontSize:14,color:"#E8C44A",fontFamily:"monospace",fontWeight:700}},(volAnualHist*100).toFixed(2)+"%"),
              h("div",{style:{fontSize:7,color:"#5A5550",marginTop:2,fontFamily:"monospace"}},"desvio padrao a.a.")
            ),
            h("div",{style:{background:"rgba(0,0,0,0.20)",borderRadius:6,padding:"9px 11px",borderLeft:"3px solid #E89060"}},
              h("div",{style:{fontSize:7,color:"#7A7060",fontFamily:"monospace",letterSpacing:1.2,marginBottom:3}},"VOL. DOWNSIDE"),
              h("div",{style:{fontSize:14,color:"#E89060",fontFamily:"monospace",fontWeight:700}},volDownAnualHist?(volDownAnualHist*100).toFixed(2)+"%":"0,00%"),
              h("div",{style:{fontSize:7,color:"#5A5550",marginTop:2,fontFamily:"monospace"}},"so quedas a.a.")
            )
          ),
          // SHARPE
          (()=>{
            const sh=sharpeHist;
            const corS=sh===null?"#7A7060":sh>=1?"#4CAF82":sh>=0.5?"#E8C44A":sh>=0?"#E89060":"#E05252";
            const intS=sh===null?"Insuficiente":sh>=1?"EXCELENTE":sh>=0.5?"BOM":sh>=0?"REGULAR":"NEGATIVO";
            return h("div",{style:{background:"rgba(0,0,0,0.20)",borderRadius:6,padding:"11px 13px",marginBottom:10,borderLeft:"3px solid "+corS}},
              h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,gap:6,flexWrap:"wrap"}},
                h("div",{},
                  h("div",{style:{fontSize:9,letterSpacing:1.5,color:"#C8A96E",fontFamily:"monospace",fontWeight:700}},"INDICE DE SHARPE"),
                  h("div",{style:{fontSize:8,color:"#7A7060",fontStyle:"italic",marginTop:2}},"Retorno excedente por unidade de risco TOTAL")
                ),
                h("div",{style:{textAlign:"right"}},
                  h("div",{style:{fontSize:16,color:corS,fontFamily:"monospace",fontWeight:700}},sh!==null?sh.toFixed(3):"---"),
                  h("div",{style:{fontSize:8,color:corS,fontFamily:"monospace",fontWeight:700,letterSpacing:1.5}},intS)
                )
              ),
              h("div",{style:{fontSize:9,color:"#9A9080",lineHeight:1.55,marginTop:4}},
                h("strong",{style:{color:"#C8A96E"}},"Formula"),": (Retorno Portfolio - Selic) / Volatilidade Total. ",
                h("strong",{style:{color:"#5B8FD4"}},"Interpretacao"),": >1.0 excelente (raro), 0.5-1.0 bom (faixa tipica de portfolios bem diversificados), 0-0.5 regular, <0 ruim (Selic pura seria melhor). ",
                "Sharpe mede o ",h("em",{},"premio de risco que voce esta capturando")," por unidade de oscilacao total - se positivo, voce esta sendo recompensado por tomar risco em vez de ficar so na Selic."
              )
            );
          })(),
          // SORTINO
          (()=>{
            const so=sortinoHist;
            const finita=so!==null&&isFinite(so);
            const corS=!finita?"#4CAF82":so>=1.5?"#4CAF82":so>=0.8?"#E8C44A":so>=0?"#E89060":"#E05252";
            const intS=so===null?"Insuficiente":!finita?"EXCEPCIONAL":so>=1.5?"EXCELENTE":so>=0.8?"BOM":so>=0?"REGULAR":"NEGATIVO";
            const valDisplay=so===null?"---":!finita?"\u221E":so.toFixed(3);
            return h("div",{style:{background:"rgba(0,0,0,0.20)",borderRadius:6,padding:"11px 13px",marginBottom:6,borderLeft:"3px solid "+corS}},
              h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,gap:6,flexWrap:"wrap"}},
                h("div",{},
                  h("div",{style:{fontSize:9,letterSpacing:1.5,color:"#C8A96E",fontFamily:"monospace",fontWeight:700}},"INDICE DE SORTINO"),
                  h("div",{style:{fontSize:8,color:"#7A7060",fontStyle:"italic",marginTop:2}},"Retorno excedente por unidade de risco DOWNSIDE")
                ),
                h("div",{style:{textAlign:"right"}},
                  h("div",{style:{fontSize:16,color:corS,fontFamily:"monospace",fontWeight:700}},valDisplay),
                  h("div",{style:{fontSize:8,color:corS,fontFamily:"monospace",fontWeight:700,letterSpacing:1.5}},intS)
                )
              ),
              h("div",{style:{fontSize:9,color:"#9A9080",lineHeight:1.55,marginTop:4}},
                h("strong",{style:{color:"#C8A96E"}},"Formula"),": (Retorno Portfolio - Selic) / Volatilidade Downside. ",
                h("strong",{style:{color:"#5B8FD4"}},"Diferenca para Sharpe"),": Sortino so penaliza ",h("em",{},"oscilacoes negativas"),". Volatilidade para cima nao e \"risco\" (voce nao se incomoda quando sobe). ",
                "Sortino mais alto que Sharpe indica que sua volatilidade vem mais de movimentos positivos do que negativos. ",
                h("strong",{style:{color:"#5B8FD4"}},"Interpretacao"),": >1.5 excelente, 0.8-1.5 bom, 0-0.8 regular, <0 ruim. ",
                !finita?"Seu portfolio nao teve nenhum mes negativo no periodo analisado - cenario excepcional.":""
              )
            );
          })(),
          // Comparativo Sharpe vs Sortino
          (()=>{
            if(sharpeHist===null||sortinoHist===null||!isFinite(sortinoHist))return null;
            const dif=sortinoHist-sharpeHist;
            const corD=dif>=0.3?"#4CAF82":dif>=0?"#E8C44A":"#E89060";
            return h("div",{style:{background:"rgba(91,143,212,0.05)",borderRadius:5,padding:"8px 10px",fontSize:9,color:"#9A9080",lineHeight:1.6,borderLeft:"3px solid "+corD,fontStyle:"italic"}},
              h("strong",{style:{color:corD,fontStyle:"normal"}},"\u{1F50D} ANALISE"),": ",
              dif>=0.3?
                "Sortino significativamente maior que Sharpe ("+dif.toFixed(2)+" de diferenca). Indica que sua volatilidade vem majoritariamente de movimentos POSITIVOS. Excelente sinal de qualidade da carteira - voce esta sendo bem remunerado pelos riscos que importam."
              :dif>=0?
                "Sortino levemente acima do Sharpe ("+dif.toFixed(2)+" de diferenca). Volatilidade do portfolio e relativamente equilibrada entre movimentos pra cima e pra baixo. Padrao normal de carteira diversificada."
              :
                "Sortino abaixo do Sharpe (diferenca "+dif.toFixed(2)+"). Indica que parte significativa da volatilidade vem de movimentos NEGATIVOS. Considere revisar a composicao para reduzir downside."
            );
          })(),
          // Disclaimer transparencia
          h("div",{style:{fontSize:8,color:"#6A6050",marginTop:10,fontStyle:"italic",lineHeight:1.5,padding:"6px 8px",background:"rgba(0,0,0,0.15)",borderRadius:4}},
            "\u{1F4DD} ",h("strong",{},"Como sao calculados"),": retornos mensais reais do seu portfolio (descontando aportes), anualizados via composicao. Sharpe usa volatilidade total, Sortino usa apenas a volatilidade dos meses com retorno negativo. Janela: ate 12 ultimos meses disponiveis. Quanto mais meses voce acumular, mais confiavel a metrica."
          )
        )
      ),

      // ========== PREMISSAS (transparencia) ==========
      h("details",{style:{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"10px 13px",marginBottom:8}},
        h("summary",{style:{cursor:"pointer",fontSize:8,letterSpacing:2,color:"#8A8070",fontFamily:"monospace"}},"PREMISSAS (CLIQUE PARA VER)"),
        h("div",{style:{marginTop:10}},
          h("div",{style:{fontSize:8,color:"#8A8070",marginBottom:6,fontFamily:"monospace",letterSpacing:1.5}},"RETORNOS E VOLATILIDADES (anualizados)"),
          ...MPT_CLS.map(cid=>{
            const cl=CL.find(c=>c.id===cid);
            if(!cl)return null;
            return h("div",{key:cid,style:{display:"grid",gridTemplateColumns:"60px 1fr 60px 60px",gap:6,fontSize:9,fontFamily:"monospace",padding:"2px 0",alignItems:"center"}},
              h("span",{style:{color:cl.color,fontWeight:700}},cl.tag),
              h("span",{style:{color:"#9A9080",fontSize:8}},cl.name),
              h("span",{style:{textAlign:"right",color:"#4CAF82"}},"R "+(MPT_RET[cid]*100).toFixed(1)+"%"),
              h("span",{style:{textAlign:"right",color:"#E89060"}},"V "+(MPT_VOL[cid]*100).toFixed(1)+"%")
            );
          }),
          h("div",{style:{fontSize:8,color:"#6A6050",marginTop:8,fontStyle:"italic",lineHeight:1.4}},
            "Fontes: IFIX (Santander 10 anos 2011-2020: 10,5% retorno + 8,6% vol). S&P 500 (Damodaran 100 anos: 10,4%). Bitcoin (Fidelity Q1 2025: 52% vol em queda secular). Ouro (NYDIG: 15,5% vol). Selic refletindo politica monetaria atual. Imoveis/Infra/Agro calibrados por categoria. Valores em BRL incluem premia cambial estimada para ativos USD."
          )
        )
      )
    );
    }catch(e){
      console.error("Erro renderizando MPT:",e);
      content=h("div",{style:{padding:"24px 16px",background:"rgba(224,82,82,0.06)",border:"1px solid rgba(224,82,82,0.25)",borderRadius:8,marginTop:12}},
        h("div",{style:{fontSize:11,color:"#E05252",fontFamily:"monospace",fontWeight:700,marginBottom:8}},"\u26A0 Erro ao renderizar a aba MPT"),
        h("div",{style:{fontSize:10,color:"#9A9080",lineHeight:1.6,fontFamily:"monospace",whiteSpace:"pre-wrap"}},
          "Mensagem: "+(e&&e.message?e.message:String(e))+"\n\nLinha aproximada: "+(e&&e.stack?(e.stack.split('\n')[1]||"").trim():"n/a")
        ),
        h("div",{style:{fontSize:9,color:"#6A6050",marginTop:10,fontStyle:"italic"}},"Compartilhe esta mensagem para ajudar no diagnostico.")
      );
    }
  }

  // ALL WEATHER (Ray Dalio adaptado ao Brasil)
  if(tab==="aw"){
    const rfAW=(typeof selicAtual==="number"&&selicAtual>0?selicAtual:10)/100;
    const wAW=MPT_CLS.map(cid=>AW_W[cid]||0);
    const statsAW=mptStats(wAW);
    const sharpeAW=mptSharpe(statsAW.ret,statsAW.vol,rfAW);
    const betaAW=mptBeta(wAW);
    // Stats do portfolio atual (pra comparacao)
    const wAtualAW=MPT_CLS.map(cid=>(cw[cid]||0)/100);
    const somaWA=wAtualAW.reduce((a,b)=>a+b,0);
    if(somaWA>0){for(let i=0;i<wAtualAW.length;i++)wAtualAW[i]/=somaWA;}
    const statsAtualAW=mptStats(wAtualAW);
    const sharpeAtualAW=mptSharpe(statsAtualAW.ret,statsAtualAW.vol,rfAW);

    // Calcula peso por cenario (soma ponderada)
    const cenStats=["c1","c2","c3","c4"].map(cen=>{
      let prot=0;
      MPT_CLS.forEach(cid=>{
        const w=AW_W[cid]||0;
        const p=AW_CEN[cid][cen]||0;
        prot+=w*p;
      });
      return{cen,prot};
    });

    const CENARIOS=[
      {id:"c1",nome:"CRESCIMENTO ALTO + INFLACAO ALTA",cor:"#E89060",icon:"\u{1F525}",exemplo:"Brasil 2021-22, economia aquecida"},
      {id:"c2",nome:"CRESCIMENTO ALTO + INFLACAO BAIXA",cor:"#4CAF82",icon:"\u{1F331}",exemplo:"EUA 2010s, Goldilocks"},
      {id:"c3",nome:"CRESCIMENTO BAIXO + INFLACAO ALTA",cor:"#E05252",icon:"\u26A1",exemplo:"Estagflacao 1970s, Brasil 2015"},
      {id:"c4",nome:"CRESCIMENTO BAIXO + INFLACAO BAIXA",cor:"#5B8FD4",icon:"\u2744",exemplo:"Recessao deflacionaria, 2008 inicial"}
    ];

    content=h("div",{},
      h("div",{style:{fontSize:9,letterSpacing:3,color:"#2EBFA5",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"All Weather Portfolio"),
      h("p",{style:{color:"#8A8070",fontSize:9,lineHeight:1.5,marginBottom:14,fontStyle:"italic"}},
        "Filosofia de Ray Dalio (Bridgewater): portfolio que performa em qualquer cenario macroeconomico. Adaptado para as 10 classes brasileiras."
      ),

      // ========== ALOCACAO AW ==========
      h("div",{style:{background:"rgba(46,191,165,0.05)",border:"1px solid rgba(46,191,165,0.25)",borderRadius:8,padding:"12px 13px",marginBottom:13}},
        h("div",{style:{fontSize:8,letterSpacing:2,color:"#2EBFA5",fontFamily:"monospace",marginBottom:10}},"ALOCACAO ALL WEATHER vs ATUAL"),
        ...MPT_CLS.map((cid,i)=>{
          const cl=CL.find(c=>c.id===cid);
          if(!cl)return null;
          const cur=(cw[cid]||0);
          const aw=(AW_W[cid]||0)*100;
          const diff=aw-cur;
          return h("div",{key:cid,style:{display:"grid",gridTemplateColumns:"55px 1fr 50px 50px 50px",gap:6,alignItems:"center",fontSize:9,fontFamily:"monospace",padding:"3px 0"}},
            h("span",{style:{color:cl.color,fontWeight:700}},cl.tag),
            h("div",{style:{position:"relative",height:6,background:"rgba(255,255,255,0.04)",borderRadius:3}},
              h("div",{style:{position:"absolute",top:0,left:0,height:"100%",width:Math.min(100,cur)+"%",background:cl.color+"66",borderRadius:3}}),
              h("div",{style:{position:"absolute",top:0,left:0,height:"100%",width:Math.min(100,aw)+"%",background:cl.color,borderRadius:3,opacity:0.7}})
            ),
            h("span",{style:{textAlign:"right",color:"#8A8070"}},cur.toFixed(1)+"%"),
            h("span",{style:{textAlign:"right",color:"#2EBFA5",fontWeight:700}},aw.toFixed(1)+"%"),
            h("span",{style:{textAlign:"right",color:Math.abs(diff)<2?"#5A5550":diff>0?"#4CAF82":"#E05252",fontSize:8}},(diff>=0?"+":"")+diff.toFixed(1))
          );
        }),
        h("div",{style:{display:"grid",gridTemplateColumns:"55px 1fr 50px 50px 50px",gap:6,marginTop:6,fontSize:7,color:"#5A5550",fontFamily:"monospace",borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:6}},
          h("span",{},""),
          h("span",{},""),
          h("span",{style:{textAlign:"right"}},"ATUAL"),
          h("span",{style:{textAlign:"right"}},"AW"),
          h("span",{style:{textAlign:"right"}},"DIF")
        )
      ),

      // ========== METRICAS AW vs ATUAL ==========
      h("div",{style:{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"12px 13px",marginBottom:13}},
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:9,alignItems:"end"}},
          h("div",{style:{fontSize:7,letterSpacing:1.5,color:"#8A8070",fontFamily:"monospace"}},"METRICA"),
          h("div",{style:{fontSize:8,letterSpacing:1.5,color:"#E05252",fontFamily:"monospace",textAlign:"right",fontWeight:700}},"ATUAL"),
          h("div",{style:{fontSize:8,letterSpacing:1.5,color:"#2EBFA5",fontFamily:"monospace",textAlign:"right",fontWeight:700}},"ALL WEATHER")
        ),
        ...[
          {nome:"RET ESPERADO",sub:"anualizado BRL",a:(statsAtualAW.ret*100).toFixed(2)+"%",b:(statsAW.ret*100).toFixed(2)+"%",cor:"#4CAF82"},
          {nome:"VOLATILIDADE",sub:"desvio padrao",a:(statsAtualAW.vol*100).toFixed(2)+"%",b:(statsAW.vol*100).toFixed(2)+"%",cor:"#E89060"},
          {nome:"SHARPE RATIO",sub:"vs Selic "+(rfAW*100).toFixed(1)+"%",a:sharpeAtualAW.toFixed(2),b:sharpeAW.toFixed(2),cor:sharpeAW>=sharpeAtualAW?"#4CAF82":"#E89060"},
          {nome:"BETA vs IBOV",sub:betaAW<0.5?"defensivo":betaAW<1?"moderado":"agressivo",a:mptBeta(wAtualAW).toFixed(2),b:betaAW.toFixed(2),cor:"#5B8FD4"}
        ].map((m,i)=>h("div",{key:i,style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,padding:"5px 0",borderTop:"1px solid rgba(255,255,255,0.05)"}},
          h("div",{},
            h("div",{style:{fontSize:8,color:"#8A8070",letterSpacing:1.2,fontFamily:"monospace"}},m.nome),
            h("div",{style:{fontSize:6.5,color:"#5A5550",fontStyle:"italic"}},m.sub)
          ),
          h("div",{style:{textAlign:"right",fontSize:14,color:m.cor,fontFamily:"monospace",fontWeight:700}},m.a),
          h("div",{style:{textAlign:"right",fontSize:14,color:m.cor,fontFamily:"monospace",fontWeight:700,opacity:0.85}},m.b)
        ))
      ),

      // ========== 4 CENARIOS ==========
      h("div",{style:{fontSize:8,letterSpacing:2,color:"#2EBFA5",fontFamily:"monospace",marginBottom:8,marginTop:18}},"OS 4 CENARIOS MACROECONOMICOS"),
      h("p",{style:{fontSize:9,color:"#6A6050",fontStyle:"italic",lineHeight:1.5,marginBottom:10}},
        "Dalio argumenta que toda economia transita entre 4 estados. O All Weather aloca para que algumas classes prosperem em cada cenario."
      ),
      ...CENARIOS.map((cen,idx)=>{
        const cs=cenStats[idx];
        // Top classes protetoras (peso AW * fator do cenario) para mostrar no AW
        const ranking=MPT_CLS.map(cid=>({cid,score:AW_CEN[cid][cen.id]*AW_W[cid]})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);
        // ===== CALCULA INSIGHT DO PORTFOLIO ATUAL NESTE CENARIO =====
        // Protecao atual (soma ponderada da sua alocacao * fatores de protecao)
        let protAtual=0;
        MPT_CLS.forEach(cid=>{
          const w=wAtualAW[MPT_CLS.indexOf(cid)]||0;
          protAtual+=w*(AW_CEN[cid][cen.id]||0);
        });
        const gapAW=cs.prot-protAtual;
        // Ranking por contribuicao do PORTFOLIO ATUAL no cenario
        const minhasContribs=MPT_CLS.map(cid=>{
          const i=MPT_CLS.indexOf(cid);
          const w=wAtualAW[i]||0;
          return{cid,w,fator:AW_CEN[cid][cen.id]||0,contrib:w*(AW_CEN[cid][cen.id]||0)};
        }).filter(x=>x.w>0.005);
        const meuMaior=minhasContribs.slice().sort((a,b)=>b.contrib-a.contrib)[0];
        // Classes que voce TEM mas protegem pouco neste cenario (peso alto, fator baixo)
        const vulnerab=minhasContribs.filter(x=>x.fator<0.4&&x.w>0.05).sort((a,b)=>b.w-a.w)[0];
        // Classes que voce NAO TEM (ou tem pouco) que protegem bem
        const oportunidade=MPT_CLS.map(cid=>{
          const i=MPT_CLS.indexOf(cid);
          const w=wAtualAW[i]||0;
          return{cid,w,fator:AW_CEN[cid][cen.id]||0};
        }).filter(x=>x.fator>=0.7&&x.w<0.05).sort((a,b)=>b.fator-a.fator)[0];
        // Constroi mensagem do insight
        const meuMaiorCL=meuMaior?CL.find(c=>c.id===meuMaior.cid):null;
        const vulnerabCL=vulnerab?CL.find(c=>c.id===vulnerab.cid):null;
        const oportunidadeCL=oportunidade?CL.find(c=>c.id===oportunidade.cid):null;
        // Avaliacao geral (compara com 50% como referencia neutra)
        let avaliacao,corAval;
        if(protAtual>=0.55){avaliacao="BEM POSICIONADO";corAval="#4CAF82";}
        else if(protAtual>=0.45){avaliacao="POSICIONAMENTO MODERADO";corAval="#E8C44A";}
        else if(protAtual>=0.35){avaliacao="EXPOSICAO LIMITADA";corAval="#E89060";}
        else{avaliacao="VULNERAVEL";corAval="#E05252";}
        return h("div",{key:cen.id,style:{background:"rgba(255,255,255,0.02)",border:"1px solid "+cen.cor+"33",borderRadius:8,padding:"11px 12px",marginBottom:10}},
          // Header com icone, nome e duas protecoes (ATUAL vs AW)
          h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:7}},
            h("span",{style:{fontSize:20}},cen.icon),
            h("div",{style:{flex:1}},
              h("div",{style:{fontSize:9,letterSpacing:1.5,color:cen.cor,fontFamily:"monospace",fontWeight:700}},cen.nome),
              h("div",{style:{fontSize:8,color:"#6A6050",fontStyle:"italic"}},"Ex: ",cen.exemplo)
            ),
            h("div",{style:{textAlign:"right"}},
              h("div",{style:{fontSize:7,color:"#8A8070"}},"PROTECAO"),
              h("div",{style:{display:"flex",gap:6,alignItems:"baseline",justifyContent:"flex-end"}},
                h("span",{style:{fontSize:13,color:"#E05252",fontFamily:"monospace",fontWeight:700,title:"ATUAL"}},(protAtual*100).toFixed(0)+"%"),
                h("span",{style:{fontSize:9,color:"#6A6050"}},"/"),
                h("span",{style:{fontSize:11,color:"#2EBFA5",fontFamily:"monospace",fontWeight:700,opacity:0.85,title:"AW ideal"}},(cs.prot*100).toFixed(0)+"%")
              ),
              h("div",{style:{fontSize:6.5,color:"#6A6050",fontFamily:"monospace",marginTop:1}},"atual / AW")
            )
          ),
          // INSIGHT DO PORTFOLIO ATUAL NESTE CENARIO
          h("div",{style:{background:"rgba(0,0,0,0.18)",borderLeft:"3px solid "+corAval,borderRadius:"0 5px 5px 0",padding:"7px 10px",marginBottom:7}},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}},
              h("span",{style:{fontSize:7,letterSpacing:1.5,color:corAval,fontFamily:"monospace",fontWeight:700}},"SUA EXPOSICAO: "+avaliacao),
              gapAW!==0&&h("span",{style:{fontSize:7,color:Math.abs(gapAW)<0.05?"#6A6050":gapAW>0?"#E89060":"#4CAF82",fontFamily:"monospace"}},
                gapAW>0?"\u2193 "+(gapAW*100).toFixed(0)+"pp vs AW":"\u2191 "+(Math.abs(gapAW)*100).toFixed(0)+"pp vs AW"
              )
            ),
            h("p",{style:{fontSize:9,color:"#9A9080",lineHeight:1.55,margin:0}},
              meuMaiorCL&&h("span",{},"Sua maior protecao vem de ",h("strong",{style:{color:meuMaiorCL.color}},meuMaiorCL.tag)," (",(meuMaior.w*100).toFixed(1),"% da carteira). "),
              vulnerabCL&&h("span",{},"Atencao a sua alocacao em ",h("strong",{style:{color:vulnerabCL.color}},vulnerabCL.tag)," (",(vulnerab.w*100).toFixed(1),"%): protege pouco aqui. "),
              oportunidadeCL&&gapAW>0.05&&h("span",{},"Considere aumentar ",h("strong",{style:{color:oportunidadeCL.color}},oportunidadeCL.tag)," para melhor hedge. ")
            )
          ),
          h("div",{style:{fontSize:8,color:"#8A8070",marginBottom:5,fontFamily:"monospace"}},"CLASSES MAIS PROTETORAS NO AW:"),
          h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},

        // Aportes corrigidos pela inflacao = poder de compra constante = simulamos como aporte real fixo

          cap=cap*(1+retReal)+aporteAnual;
          trajetoria.push(cap);

        // Se modo nominal, inflamos pelo IPCA
        if(modo==="nominal"){
          return trajetoria.map((v,i)=>v*Math.pow(1+PROJ_INFL,i));
        }
        return trajetoria;

      const randn=()=>{// Box-Muller
        const u1=Math.max(1e-10,Math.random()),u2=Math.random();
        return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);

      const monteCarloPort=(P0,aporteMensal,anos,retReal,volReal,nSim,modo)=>{

  // Tela de PIN - mostra antes de tudo se nao autenticado
  function renderTelaPin(){
    const PIN_LEN=6;
    // Legacy: PIN antigo de 4 digitos
    let pinAntigo="";
    try{pinAntigo=localStorage.getItem("pat-pin")||"";}catch{}
    const temLegacy=!!pinAntigo&&!pinHash;
    const ehNovo=!pinHash&&!temLegacy;
    // modos: entrada | criar | confirmar | esqueci | migrar (digite PIN antigo de 4 digitos)
    const modo=temLegacy?(pinMode==="entrada"?"migrar":pinMode):(ehNovo?(pinMode==="entrada"?"criar":pinMode):pinMode);
    const tamEsperado=modo==="migrar"?4:PIN_LEN;
    // Bloqueio por tentativas
    lockTick;// referencia o tick para forcar re-render
    const bloqueado=pinAttempts.lockUntil>Date.now();
    const segRest=bloqueado?Math.ceil((pinAttempts.lockUntil-Date.now())/1000):0;
    const minRest=Math.floor(segRest/60);const secRest=segRest%60;
    const titulo=bloqueado?"Bloqueado temporariamente":
                 modo==="criar"?"Criar novo PIN":
                 modo==="confirmar"?"Confirmar PIN":
                 modo==="esqueci"?"Recuperar acesso":
                 modo==="migrar"?"Atualizar seguranca":"Digite o PIN";
    const subtitulo=bloqueado?("Aguarde "+(minRest>0?minRest+"min "+secRest+"s":secRest+"s")+" para tentar de novo"):
                    modo==="criar"?"Defina 6 digitos para proteger seu app":
                    modo==="confirmar"?"Digite o mesmo PIN novamente":
                    modo==="esqueci"?"Cole sua chave API Anthropic para resetar o PIN":
                    modo==="migrar"?"Digite seu PIN atual (4 digitos) para migrar":
                    "Acesso ao Portfolio Patrimonial";
    // Hash legado (DJB2) so para validacao na migracao
    const hashLegacy=(s)=>{let hh=5381;for(let i=0;i<s.length;i++)hh=((hh<<5)+hh)+s.charCodeAt(i);return String(hh);};
    const registrarFalha=()=>{
      const novoN=(pinAttempts.n||0)+1;
      let lockUntil=0;
      if(novoN>=5)lockUntil=Date.now()+30*60*1000;// 30 min
      else if(novoN>=3)lockUntil=Date.now()+5*60*1000;// 5 min
      const novo={n:novoN,lockUntil};
      setPinAttempts(novo);
      try{localStorage.setItem(SK_ATT,JSON.stringify(novo));}catch{}
    };
    const limparFalhas=()=>{
      const novo={n:0,lockUntil:0};
      setPinAttempts(novo);
      try{localStorage.setItem(SK_ATT,JSON.stringify(novo));}catch{}
    };
    const onDigit=async(d)=>{
      if(bloqueado)return;
      setPinErr("");
      if(modo==="esqueci")return;
      if(pinInput.length<tamEsperado){
        const novo=pinInput+d;
        setPinInput(novo);
        if(novo.length===tamEsperado){
          if(modo==="criar"){
            setPinNovo(novo);setPinInput("");setPinMode("confirmar");
          }else if(modo==="confirmar"){
            if(novo===pinNovo){
              setPinErr("Configurando seguranca...");
              try{
                const h2=await sha256Hex(novo);
                const key=await deriveKey(novo);
                try{localStorage.setItem(SK_PIN,h2);}catch{}
                // Se veio do fluxo de migracao (havia pat-v9), o load criptografara
                setPinHash(h2);setAesKey(key);
                // Se foi um reset via API key, restaura a chave temporaria criptografada
                try{
                  const tmpKey=sessionStorage.getItem("pat-tmp-key");
                  if(tmpKey){
                    await saveApiKey(key,tmpKey);
                    setApiKeyS(tmpKey);
                    sessionStorage.removeItem("pat-tmp-key");
                  }
                }catch{}
                setPinInput("");setPinNovo("");setAutenticado(true);setPinMode("entrada");setPinErr("");
                limparFalhas();
              }catch(e){setPinErr("Erro: "+e.message);}
            }else{
              setPinErr("PINs nao conferem. Tente novamente.");
              setTimeout(()=>{setPinInput("");setPinNovo("");setPinMode("criar");setPinErr("");},1600);
            }
          }else if(modo==="migrar"){
            // Valida PIN antigo (4 digitos, DJB2)
            if(hashLegacy(novo)===pinAntigo){
              // PIN antigo correto - pede pra criar novo de 6 digitos
              setPinErr("");
              setPinInput("");
              // Remove PIN antigo, mas mantem pat-v9 para o load migrar
              try{localStorage.removeItem("pat-pin");}catch{}
              setPinMode("criar");
              limparFalhas();
            }else{
              registrarFalha();
              setPinErr("PIN incorreto");
              setTimeout(()=>{setPinInput("");setPinErr("");},900);
            }
          }else{
            // entrada - valida SHA-256
            try{
              const h2=await sha256Hex(novo);
              if(h2===pinHash){
                setPinErr("Desbloqueando...");
                const key=await deriveKey(novo);
                setAesKey(key);
                setPinInput("");setAutenticado(true);setPinErr("");
                limparFalhas();
              }else{
                registrarFalha();
                setPinErr("PIN incorreto");
                setTimeout(()=>{setPinInput("");setPinErr("");},900);
              }
            }catch(e){setPinErr("Erro: "+e.message);}
          }
        }
      }
    };

        });

            localStorage.removeItem(SK_ATT);
            localStorage.removeItem("pat-pin");
            localStorage.removeItem("pat-v9");
          }catch{}
          // Armazena chave API temporariamente em sessionStorage pra apos criar novo PIN
          try{sessionStorage.setItem("pat-tmp-key",k);}catch{}
          setPinHash("");setPinErr("");setPinMode("criar");setPinInput("");setPinNovo("");
        }else{
          setPinErr("Chave invalida ou sem credito.");
        }
      }catch(e){setPinErr("Erro ao validar: "+e.message);}
    };
    const keypad=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,maxWidth:280,margin:"0 auto",opacity:bloqueado?0.3:1,pointerEvents:bloqueado?"none":"auto"}},
      ...["1","2","3","4","5","6","7","8","9"].map(d=>h("button",{key:d,onClick:()=>onDigit(d),style:{padding:"18px 0",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(200,169,110,0.18)",borderRadius:10,color:"#F0EAD8",fontSize:22,fontFamily:"monospace",cursor:"pointer"}},d)),
      h("button",{onClick:onDel,style:{padding:"18px 0",background:"transparent",border:"1px solid rgba(255,255,255,0.06)",borderRadius:10,color:"#7A7570",fontSize:16,fontFamily:"monospace",cursor:"pointer"}},"<"),
      h("button",{onClick:()=>onDigit("0"),style:{padding:"18px 0",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(200,169,110,0.18)",borderRadius:10,color:"#F0EAD8",fontSize:22,fontFamily:"monospace",cursor:"pointer"}},"0"),
      h("div",{})
    );
    const indicadores=Array.from({length:tamEsperado},(_,i)=>i);
    return h("div",{style:{minHeight:"100vh",background:"#0D0F14",color:"#E8E2D5",fontFamily:"Georgia,serif",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 18px"}},
      h("div",{style:{width:"100%",maxWidth:360,textAlign:"center"}},
        h("div",{style:{fontSize:9,letterSpacing:5,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:10}},"Planejamento Patrimonial"),
        h("h1",{style:{margin:"0 0 6px",fontSize:26,fontWeight:400,color:"#F0EAD8"}},titulo),
        h("p",{style:{color:"#8A8070",fontSize:12,marginBottom:28,fontStyle:"italic"}},subtitulo),
        bloqueado?h("div",{style:{padding:"30px 0",fontSize:42,color:"#E05252",fontFamily:"monospace"}},(minRest>0?minRest+":":"")+(secRest<10?"0"+secRest:secRest)):
        modo==="esqueci"?h("div",{},
          h("textarea",{id:"recovery-key",placeholder:"sk-ant-api03-...",rows:3,style:{width:"100%",background:"rgba(0,0,0,0.4)",border:"1px solid rgba(200,169,110,0.3)",borderRadius:8,padding:"10px 12px",color:"#F0EAD8",fontSize:12,fontFamily:"monospace",outline:"none",boxSizing:"border-box",resize:"none",marginBottom:10}}),
          h("div",{style:{fontSize:10,color:"#E8C44A",marginBottom:10,fontStyle:"italic"}},"Atencao: resetar o PIN apaga todos os dados criptografados. Tenha backup JSON pronto."),
          h("button",{onClick:validarApiKeyEResetar,style:{width:"100%",padding:"12px",background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,color:"#0D0F14",fontSize:12,fontWeight:700,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",marginBottom:8}},"Validar e resetar PIN"),
          h("button",{onClick:()=>{setPinMode("entrada");setPinErr("");},style:{background:"none",border:"none",color:"#8A8070",fontSize:11,cursor:"pointer",textDecoration:"underline"}},"voltar")
        ):h("div",{},
          h("div",{style:{display:"flex",justifyContent:"center",gap:tamEsperado>4?10:14,marginBottom:34}},
            ...indicadores.map(i=>h("div",{key:i,style:{width:14,height:14,borderRadius:"50%",background:i<pinInput.length?"#C8A96E":"transparent",border:"2px solid "+(i<pinInput.length?"#C8A96E":"rgba(200,169,110,0.25)"),transition:"all 0.15s"}}))
          ),
          keypad,
          !ehNovo&&!temLegacy&&modo==="entrada"&&h("button",{onClick:()=>{setPinMode("esqueci");setPinErr("");setPinInput("");},style:{background:"none",border:"none",color:"#8A8070",fontSize:11,cursor:"pointer",textDecoration:"underline",marginTop:20}},"esqueci o PIN"),
          pinAttempts.n>0&&!bloqueado&&modo==="entrada"&&h("div",{style:{fontSize:10,color:"#E8C44A",marginTop:14,fontFamily:"monospace"}},"Tentativas erradas: "+pinAttempts.n+(pinAttempts.n>=3?" - 30min de bloqueio em "+(5-pinAttempts.n)+" tentativas":""))
        ),
        pinErr&&h("div",{style:{color:pinErr.includes("Validando")||pinErr.includes("Desbloqueando")||pinErr.includes("Configurando")?"#C8A96E":"#E05252",fontSize:11,marginTop:14,fontFamily:"monospace"}},pinErr)
      )
    );
  }

  return h("div",{style:{minHeight:"100vh",background:"#0D0F14",color:"#E8E2D5",fontFamily:"Georgia,serif",paddingBottom:80}},
    header,
    h("div",{style:{padding:"0 18px"}},tabs,content),
    // Modal diagnostico DBG (variacao %)
    dbgInfo&&h("div",{
      onClick:e=>{if(e.target===e.currentTarget)setDbgInfo("");},
      style:{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}
    },
      h("div",{style:{background:"#1A1D24",border:"1px solid #5B8FD455",borderRadius:8,padding:16,maxWidth:480,width:"100%",maxHeight:"85vh",display:"flex",flexDirection:"column",gap:10}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8}},
          h("span",{style:{fontSize:13,color:"#5B8FD4",fontFamily:"monospace",fontWeight:700,flex:1}},"DIAGNOSTICO DE VARIACAO"),
          h("button",{onClick:()=>setDbgInfo(""),style:{background:"none",border:"none",color:"#E05252",fontSize:16,cursor:"pointer",padding:"2px 8px"}},"\u2715")
        ),
        h("textarea",{
          value:dbgInfo,
          readOnly:true,
          onFocus:e=>e.target.select(),
          onClick:e=>e.target.select(),
          style:{flex:1,minHeight:280,background:"#0D0F14",border:"1px solid #3A3830",borderRadius:4,padding:10,color:"#F0EAD8",fontFamily:"monospace",fontSize:11,lineHeight:1.5,resize:"vertical",WebkitUserSelect:"text",userSelect:"text"}
        }),
        h("div",{style:{display:"flex",gap:8}},
          h("button",{
            onClick:async()=>{
              try{
                if(navigator.clipboard&&navigator.clipboard.writeText){
                  await navigator.clipboard.writeText(dbgInfo);
                  alert("Copiado para a area de transferencia!");
                }else{
                  // Fallback: seleciona o textarea
                  alert("Clipboard nao disponivel. Toque e segure no texto para selecionar manualmente.");
                }
              }catch(e){alert("Erro ao copiar: "+e.message);}
            },
            style:{flex:1,background:"#5B8FD4",border:"none",borderRadius:5,color:"#FFF",padding:"10px 14px",fontSize:12,fontFamily:"monospace",fontWeight:700,cursor:"pointer"}
          },"\u{1F4CB} COPIAR TUDO"),
          h("button",{
            onClick:()=>setDbgInfo(""),
            style:{background:"transparent",border:"1px solid #3A3830",borderRadius:5,color:"#8A8070",padding:"10px 14px",fontSize:12,fontFamily:"monospace",cursor:"pointer"}
          },"FECHAR")
        ),
        h("div",{style:{fontSize:9,color:"#6A6050",fontStyle:"italic",lineHeight:1.4}},
          "Toque no botao COPIAR ou toque longo no texto para selecionar."
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
