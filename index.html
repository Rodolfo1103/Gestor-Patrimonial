function exportData(data){
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="portfolio_backup_"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(url);
}

function mkL(cu){
  const ccy={...BCCY},cls={},lbl={...NAMES};
  Object.entries(BASE).forEach(([cid,ts])=>ts.forEach(t=>{cls[t]=cid;}));
  Object.entries(cu||{}).forEach(([cid,list])=>{
    (list||[]).forEach(a=>{ccy[a.ticker]=a.ccy||"BRL";cls[a.ticker]=cid;lbl[a.ticker]=a.label||a.ticker;});
  });
  return {ccy,cls,lbl};
}
function pv(t,p,ccy){
  if(!p)return 0;
  if(VB.includes(t))return p.totalBRL||0;
  if(GB.includes(t))return(p.qty||0)*(p.price||0);
  return(p.qty||0)*(p.price||0)*(FX[ccy[t]||"BRL"]||1);
}
function hq(t,p){if(!p)return false;if(VB.includes(t))return(p.totalBRL||0)>0;return(p.qty||0)>0;}
const fB=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);

const pc=v=>(v||0).toFixed(1)+"%";
const pN=s=>parseFloat(String(s).replace(",","."))||0;

async function callAPI(messages,key){
  const body={model:"claude-sonnet-4-6",max_tokens:1500,messages};
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||d.error.type);
  return d.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
}

// SVG helpers
function AllocChart({cw}){
  const W=300,H=155,pL=30,pB=42,pT=14,pR=8,cW=W-pL-pR,cH=H-pB-pT;
  const mx=Math.max(35,...CL.map(c=>(cw[c.id]||0)*1.15));
  const bW=Math.floor(cW/CL.length)-3;
  return h("div",{style:{marginBottom:20}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Alocacao atual vs alvo"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",overflow:"hidden"}},
      ...[0,10,20,30].filter(v=>v<=mx).map(v=>{
        const y=pT+cH-(v/mx)*cH;
        return h(Fragment,{key:v},h("line",{x1:pL,y1:y,x2:W-pR,y2:y,stroke:"rgba(255,255,255,0.05)",strokeWidth:"1"}),h("text",{x:pL-2,y:y+3,textAnchor:"end",fill:"#5A5550",fontSize:"6"},v+"%"));
      }),
      ...CL.map((c,i)=>{
        const w=cw[c.id]||0,sW=cW/CL.length,x=pL+i*sW+(sW-bW)/2;
        const bH=Math.max((w/mx)*cH,1),y=pT+cH-bH;
        const st=w<c.min?"u":w>c.max?"o":"k";
        const fill=st==="u"?"#E05252":st==="o"?"#E8C44A":c.color;
        const xm=x+bW/2,yMin=pT+cH-(c.min/mx)*cH;
        return h(Fragment,{key:c.id},
          h("line",{x1:xm-bW*.5,y1:yMin,x2:xm+bW*.5,y2:yMin,stroke:c.color,strokeWidth:"1",strokeOpacity:".4",strokeDasharray:"2,2"}),
          h("rect",{x,y,width:bW,height:bH,fill,fillOpacity:".85",rx:"2"}),
          h("text",{x:xm,y:y-2,textAnchor:"middle",fill,fontSize:"6",fontFamily:"monospace"},w.toFixed(1)),
          h("text",{x:xm,y:H-pB+13,textAnchor:"middle",fill:c.color,fontSize:"8"},c.tag),
          h("text",{x:xm,y:H-pB+24,textAnchor:"middle",fill:"#6A6050",fontSize:"5.5",fontFamily:"monospace"},c.min+"-"+c.max+"%")
        );
      }),
      h("line",{x1:pL,y1:pT+cH,x2:W-pR,y2:pT+cH,stroke:"rgba(255,255,255,0.08)",strokeWidth:"1"})
    )
  );
}

function CompareChart({cw}){
  // Radar/polygon chart: actual vs target for each class - versao clean
  const W=340,H=290,cx=170,cy=140,maxR=95;
  const n=CL.length;
  function polarPt(i,r){
    const angle=(i/n)*2*Math.PI - Math.PI/2;
    return {x:cx+r*Math.cos(angle), y:cy+r*Math.sin(angle)};
  }
  const grids=[0.33,0.66,1.0];
  const maxPct=Math.max(35,...CL.map(c=>cw[c.id]||0));
  const actualPts=CL.map((c,i)=>{
    const pct=cw[c.id]||0;
    return polarPt(i,(pct/maxPct)*maxR);
  });
  const targetPts=CL.map((c,i)=>{
    const pct=(c.min+c.max)/2;
    return polarPt(i,(pct/maxPct)*maxR);
  });
  // Posicoes dos labels (mais espacadas)
  const labelPts=CL.map((c,i)=>polarPt(i,maxR+22));
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Dispersao: Atual vs Meta"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Quao distante voce esta da alocacao alvo em cada classe"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
      // Grid circular (poligono regular)
      ...grids.map((g,gi)=>{
        const pts=CL.map((c,i)=>polarPt(i,g*maxR));
        return h("polygon",{key:g,points:pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" "),fill:gi===2?"rgba(255,255,255,0.015)":"none",stroke:"rgba(255,255,255,0.08)",strokeWidth:"0.8"});
      }),
      // Eixos
      ...CL.map((c,i)=>{
        const pt=polarPt(i,maxR);
        return h("line",{key:i,x1:cx,y1:cy,x2:pt.x.toFixed(1),y2:pt.y.toFixed(1),stroke:"rgba(255,255,255,0.07)",strokeWidth:"0.8"});
      }),
      // Poligono alvo (suave, tracejado)
      h("polygon",{points:targetPts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" "),fill:"rgba(91,143,212,0.06)",stroke:"#5B8FD4",strokeWidth:"1.5",strokeDasharray:"5,4",strokeOpacity:"0.85"}),
      // Poligono atual (destaque)
      h("polygon",{points:actualPts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" "),fill:"rgba(200,169,110,0.18)",stroke:"#C8A96E",strokeWidth:"2.2",strokeLinejoin:"round"}),
      // Pontos do atual com cor por status
      ...actualPts.map((p,i)=>{
        const w=cw[CL[i].id]||0;
        const st=w<CL[i].min?"#E05252":w>CL[i].max&&!CL[i].flex?"#E8C44A":"#4CAF82";
        return h("circle",{key:i,cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:"5",fill:st,stroke:"#0D0F14",strokeWidth:"2"});
      }),
      // Labels com fundo
      ...CL.map((c,i)=>{
        const p=labelPts[i];
        const w=cw[c.id]||0;
        const st=w<c.min?"#E05252":w>c.max&&!c.flex?"#E8C44A":"#4CAF82";
        const anchor=p.x<cx-5?"end":p.x>cx+5?"start":"middle";
        return h("g",{key:i},
          // Tag da classe
          h("text",{x:p.x.toFixed(1),y:(p.y-2).toFixed(1),textAnchor:anchor,fill:c.color,fontSize:"10",fontFamily:"monospace",fontWeight:"bold"},c.tag),
          // Percentual
          h("text",{x:p.x.toFixed(1),y:(p.y+10).toFixed(1),textAnchor:anchor,fill:st,fontSize:"9",fontFamily:"monospace"},pc(w)),
          // Alvo
          h("text",{x:p.x.toFixed(1),y:(p.y+20).toFixed(1),textAnchor:anchor,fill:"#5A5550",fontSize:"7",fontFamily:"monospace"},c.min+"-"+c.max+"%")
        );
      }),
      // Centro
      h("circle",{cx:cx,cy:cy,r:"2.5",fill:"rgba(255,255,255,0.25)"}),
      // Legenda mais espacada
      h("g",{transform:"translate(0,"+(H-18)+")"},
        h("line",{x1:12,y1:0,x2:30,y2:0,stroke:"#C8A96E",strokeWidth:"2.2"}),
        h("circle",{cx:21,cy:0,r:"3.5",fill:"#C8A96E",stroke:"#0D0F14",strokeWidth:"1.2"}),
        h("text",{x:35,y:4,fill:"#9A9080",fontSize:"8.5",fontFamily:"monospace"},"Atual"),
        h("line",{x1:80,y1:0,x2:98,y2:0,stroke:"#5B8FD4",strokeWidth:"1.5",strokeDasharray:"4,3"}),
        h("text",{x:103,y:4,fill:"#9A9080",fontSize:"8.5",fontFamily:"monospace"},"Alvo"),
        h("circle",{cx:148,cy:0,r:"4",fill:"#4CAF82"}),
        h("text",{x:155,y:4,fill:"#9A9080",fontSize:"8.5",fontFamily:"monospace"},"ok"),
        h("circle",{cx:185,cy:0,r:"4",fill:"#E05252"}),
        h("text",{x:192,y:4,fill:"#9A9080",fontSize:"8.5",fontFamily:"monospace"},"abaixo"),
        h("circle",{cx:235,cy:0,r:"4",fill:"#E8C44A"}),
        h("text",{x:242,y:4,fill:"#9A9080",fontSize:"8.5",fontFamily:"monospace"},"acima")
      )
    )
  );
}


function CurrencyChart({port,cls}){
  // Calcula exposicao por moeda (em BRL)
  const byCcy={};
  Object.entries(port||{}).forEach(([t,p])=>{
    if(!p)return;
    const v=pv(t,p,(()=>{const c={};Object.keys(BCCY).forEach(k=>c[k]=BCCY[k]);return c;})());
    if(!v)return;
    // Ouro fisico e Bitcoin viram USD na pratica (cotados em USD)
    let ccy=BCCY[t]||"BRL";
    if(GB.includes(t))ccy="BRL"; // ouro fisico comprado em reais
    byCcy[ccy]=(byCcy[ccy]||0)+v;
  });
  const total=Object.values(byCcy).reduce((a,b)=>a+b,0);
  if(total<=0)return null;
  // Ordena por valor desc
  const entries=Object.entries(byCcy).sort((a,b)=>b[1]-a[1]);
  // Cores por moeda
  const COL={BRL:"#4CAF82",USD:"#5B8FD4",EUR:"#C8A96E",GBP:"#9B7EBD",CHF:"#E05252",
    JPY:"#E8C44A",AUD:"#FF9F40",HKD:"#FF6B9D",SGD:"#4DD0E1",NOK:"#8DA9C4",DKK:"#A8C4A2",MXN:"#D17A22"};
  const NAME={BRL:"Real",USD:"Dolar EUA",EUR:"Euro",GBP:"Libra",CHF:"Franco Suico",
    JPY:"Iene",AUD:"Dolar Australiano",HKD:"Dolar HK",SGD:"Dolar Singapura",
    NOK:"Coroa Norueguesa",DKK:"Coroa Dinamarquesa",MXN:"Peso Mexicano"};
  // Donut SVG
  const W=300,H=180,cx=W/2,cy=H/2,rOut=62,rIn=38;
  let acc=0;
  const slices=entries.map(([ccy,v])=>{
    const frac=v/total,a0=acc*2*Math.PI-Math.PI/2;
    acc+=frac;
    const a1=acc*2*Math.PI-Math.PI/2;
    const large=frac>0.5?1:0;
    const x0=cx+rOut*Math.cos(a0),y0=cy+rOut*Math.sin(a0);
    const x1=cx+rOut*Math.cos(a1),y1=cy+rOut*Math.sin(a1);
    const x2=cx+rIn*Math.cos(a1),y2=cy+rIn*Math.sin(a1);
    const x3=cx+rIn*Math.cos(a0),y3=cy+rIn*Math.sin(a0);
    const d="M"+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+rOut+" "+rOut+" 0 "+large+" 1 "+x1.toFixed(1)+" "+y1.toFixed(1)+" L"+x2.toFixed(1)+" "+y2.toFixed(1)+" A"+rIn+" "+rIn+" 0 "+large+" 0 "+x3.toFixed(1)+" "+y3.toFixed(1)+" Z";
    return {d,ccy,v,frac,color:COL[ccy]||"#8A8070"};
  });
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Exposicao Cambial"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Distribuicao do patrimonio por moeda"),
    // Donut
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",maxWidth:280,display:"block",margin:"0 auto"}},
      ...slices.map((s,i)=>h("path",{key:i,d:s.d,fill:s.color,fillOpacity:0.85,stroke:"#0D0F14",strokeWidth:"1.5"})),
      h("text",{x:cx,y:cy-3,textAnchor:"middle",fill:"#8A8070",fontSize:"8",fontFamily:"monospace"},entries.length+" moeda"+(entries.length>1?"s":"")),
      h("text",{x:cx,y:cy+9,textAnchor:"middle",fill:"#C8A96E",fontSize:"10",fontFamily:"monospace",fontWeight:"bold"},fB(total).replace("R$ ",""))
    ),
    // Barras horizontais
    h("div",{style:{marginTop:14}},
      ...entries.map(([ccy,v])=>{
        const pct=(v/total)*100,color=COL[ccy]||"#8A8070";
        return h("div",{key:ccy,style:{marginBottom:10}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,fontSize:10,fontFamily:"monospace"}},
            h("span",{style:{color:color,fontWeight:"bold"}},ccy+" "+(NAME[ccy]||"")),
            h("span",{style:{color:"#8A8070"}},pc(pct)+"  "+fB(v))
          ),
          h("div",{style:{height:6,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden"}},
            h("div",{style:{height:"100%",width:pct.toFixed(1)+"%",background:color,opacity:0.85,borderRadius:3}})
          )
        );
      })
    )
  );
}

function RiskChart({cw}){
  const W=300,H=170,pL=22,pB=20,pT=12,pR=12,cW=W-pL-pR,cH=H-pB-pT;
  // Calcula posicao do portfolio agregado (media ponderada de risco e retorno)
  let totW=0,wR=0,wE=0;
  CL.forEach(c=>{const p=RR[c.id],w=cw[c.id]||0;if(p&&w>0){totW+=w;wR+=p.r*w;wE+=p.e*w;}});
  const portR=totW>0?wR/totW:null,portE=totW>0?wE/totW:null;
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Risco x Retorno esperado"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:6,fontStyle:"italic"}},"Estrela dourada = portfolio agregado. Circulos = classes."),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
      ...[0,2,4,6,8,10].map(v=>{
        const x=pL+(v/10)*cW,y=pT+cH-(v/10)*cH;
        return h(Fragment,{key:v},h("line",{x1:x,y1:pT,x2:x,y2:pT+cH,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}),h("line",{x1:pL,y1:y,x2:pL+cW,y2:y,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}));
      }),
      h("text",{x:pL+cW/2,y:H-3,textAnchor:"middle",fill:"#4A4840",fontSize:"7"},"risco ->"),
      h("text",{x:8,y:pT+cH/2,textAnchor:"middle",fill:"#4A4840",fontSize:"7",transform:"rotate(-90,8,"+(pT+cH/2)+")"},"retorno ->"),
      ...CL.map(c=>{
        const p=RR[c.id];if(!p)return null;
        const w=cw[c.id]||0,cx=pL+(p.r/10)*cW,cy=pT+cH-(p.e/10)*cH;
        const r=w>0?Math.max(Math.sqrt(w)*3.2,7):4,op=w>0?.9:.15;
        return h(Fragment,{key:c.id},
          h("circle",{cx,cy,r,fill:c.color,fillOpacity:op,stroke:c.color,strokeWidth:"1.5",strokeOpacity:op}),
          w>0&&h("text",{x:cx,y:cy+3,textAnchor:"middle",fill:"#0D0F14",fontSize:"6.5",fontWeight:"bold"},w.toFixed(0)+"%"),
          w>0&&h("text",{x:cx,y:cy-r-3,textAnchor:"middle",fill:c.color,fontSize:"8"},c.tag)
        );
      }),
      // Marcador do portfolio agregado (estrela dourada)
      portR!==null&&(()=>{
        const cx=pL+(portR/10)*cW,cy=pT+cH-(portE/10)*cH;
        // Estrela de 5 pontas
        const star=[];
        for(let i=0;i<10;i++){
          const ang=(Math.PI/5)*i-Math.PI/2;
          const rad=i%2===0?9:4;
          star.push((cx+rad*Math.cos(ang)).toFixed(1)+","+(cy+rad*Math.sin(ang)).toFixed(1));
        }
        return h(Fragment,{key:"port"},
          h("polygon",{points:star.join(" "),fill:"#FFD700",fillOpacity:0.95,stroke:"#0D0F14",strokeWidth:"1.5"}),
          h("text",{x:cx,y:cy-13,textAnchor:"middle",fill:"#FFD700",fontSize:"8",fontWeight:"bold"},"PORT"),
          h("text",{x:cx,y:cy+18,textAnchor:"middle",fill:"#FFD700",fontSize:"7",fontFamily:"monospace"},"R:"+portR.toFixed(1)+" E:"+portE.toFixed(1))
        );
      })(),
      h("line",{x1:pL,y1:pT+cH,x2:pL+cW,y2:pT+cH,stroke:"rgba(255,255,255,0.1)",strokeWidth:"1"}),
      h("line",{x1:pL,y1:pT,x2:pL,y2:pT+cH,stroke:"rgba(255,255,255,0.1)",strokeWidth:"1"})
    )
  );
}

      h("div",{style:{fontSize:13,color:"#C8A96E",fontFamily:"monospace",fontWeight:"bold"}},fB(aportesAcum[aportesAcum.length-1]))

// Heatmap mensal: variacao % do patrimonio mes a mes
function HeatmapChart({hist}){
  const data=hist.filter(r=>r.totalPatrimBRL>0).slice().reverse();
  if(data.length<2)return null;
  // Agrupa por mes (YYYY-MM), pega ultimo valor de cada mes
  const byMonth={};
  data.forEach(r=>{
    const d=new Date(r.date),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    byMonth[k]={v:r.totalPatrimBRL,ap:r.totalExecuted||r.apValue||0,date:d};
  });
  const keys=Object.keys(byMonth).sort();
  if(keys.length<2)return null;
  // Calcular variacao mes a mes descontando aportes (rentabilidade mensal aproximada)
  const variacoes=[];
  for(let i=1;i<keys.length;i++){
    const prev=byMonth[keys[i-1]],cur=byMonth[keys[i]];
    const aporteMes=cur.ap;
    // (valor_atual - aporte_do_mes - valor_anterior) / valor_anterior
    const varPct=prev.v>0?((cur.v-aporteMes-prev.v)/prev.v)*100:0;
    variacoes.push({mes:keys[i],date:cur.date,pct:varPct});
  }
  if(!variacoes.length)return null;
  // Agrupa por ano para grade
  const byYear={};
  variacoes.forEach(v=>{
    const y=v.date.getFullYear();
    if(!byYear[y])byYear[y]=Array(12).fill(null);
    byYear[y][v.date.getMonth()]=v.pct;
  });
  const years=Object.keys(byYear).sort();
  const meses=["J","F","M","A","M","J","J","A","S","O","N","D"];
  const colorFor=p=>{
    if(p===null)return"rgba(255,255,255,0.03)";
    if(p>=3)return"#1E7A4A";
    if(p>=1)return"#3D9F6A";
    if(p>=0)return"#5DBF82";
    if(p>=-1)return"#D99A55";
    if(p>=-3)return"#C46045";
    return"#A03030";
  };
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Heatmap Mensal"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Rentabilidade mensal descontando aportes"),
    ...years.map(y=>h("div",{key:y,style:{display:"flex",alignItems:"center",gap:4,marginBottom:5}},
      h("span",{style:{fontSize:9,color:"#8A8070",fontFamily:"monospace",width:34,flexShrink:0}},y),
      ...byYear[y].map((p,i)=>h("div",{key:i,title:meses[i]+" "+y+": "+(p===null?"sem dados":(p>=0?"+":"")+p.toFixed(2)+"%"),style:{flex:1,aspectRatio:"1",background:colorFor(p),borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,color:p===null?"#3A3830":(Math.abs(p)>1?"#0D0F14":"#FFFFFF"),fontFamily:"monospace",fontWeight:"bold",minHeight:22}},p===null?meses[i]:(p>=0?"+":"")+p.toFixed(1))
    ))),
    // Legenda
    h("div",{style:{display:"flex",alignItems:"center",gap:5,marginTop:8,justifyContent:"center"}},
      h("span",{style:{fontSize:8,color:"#7A7570",fontFamily:"monospace"}},"-3%"),
      ...[-3,-1,0,1,3].map(p=>h("div",{key:p,style:{width:18,height:10,background:colorFor(p),borderRadius:2}})),
      h("span",{style:{fontSize:8,color:"#7A7570",fontFamily:"monospace"}},"+3%")
    )
  );
}

// Heatmap de bandas: evolucao da posicao de cada classe em relacao ao alvo
function BandHeatmap({hist,cw}){
  // Junta o estado atual (cw) com o historico
  const data=hist.filter(r=>r.composicao).slice().reverse(); // antigo -> recente
  const nowSnap={date:new Date().toISOString(),composicao:{}};
  CL.forEach(c=>{nowSnap.composicao[c.id]=cw[c.id]||0;});
  const allSnaps=[...data,nowSnap];
  if(allSnaps.length<2)return h("div",{style:{marginBottom:14,padding:"11px 13px",background:"rgba(255,255,255,0.02)",border:"1px dashed rgba(255,255,255,0.08)",borderRadius:8,textAlign:"center"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#7A7570",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Evolucao vs Banda"),
    h("div",{style:{fontSize:10,color:"#5A5550",fontStyle:"italic"}},"Disponivel apos 1+ aporte registrado ou atualizacao de precos")
  );
  // Cor por distancia em pontos percentuais (pp) da banda alvo
  // Verde escuro = dentro, verde claro = perto, amarelo = acima, vermelho = abaixo
  const colorFor=(pct,c)=>{
    if(pct>=c.min&&pct<=c.max)return"#3D9F6A"; // dentro da banda - verde
    if(pct<c.min){
      const diff=c.min-pct;
      if(diff<=2)return"#C49A55"; // proximo - laranja claro
      if(diff<=5)return"#C46045"; // moderado - laranja
      return"#A03030"; // distante - vermelho
    }
    // acima do max
    if(c.flex)return"#5DBF82"; // selic flex
    const diff=pct-c.max;
    if(diff<=2)return"#D9C455"; // proximo - amarelo
    if(diff<=5)return"#D99A55"; // moderado - amarelo escuro
    return"#A05050"; // muito acima
  };
  // Limita a ultimas 12 colunas para caber na tela
  const snaps=allSnaps.slice(-12);
  return h("div",{style:{marginBottom:14,padding:"11px 13px",background:"rgba(76,175,130,0.04)",border:"1px solid rgba(76,175,130,0.2)",borderRadius:8}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#4CAF82",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Evolucao vs Banda Alvo"),
    h("div",{style:{fontSize:9,color:"#7A9A7A",marginBottom:9,fontStyle:"italic"}},"Como cada classe se aproxima ou afasta do alvo a cada aporte / atualizacao"),
    // Tabela
    h("div",{style:{overflowX:"auto"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:2,marginBottom:3}},
        h("div",{style:{width:40,flexShrink:0,fontSize:8,color:"#5A5550",fontFamily:"monospace"}}),
        ...snaps.map((s,i)=>{
          const d=new Date(s.date);
          const lb=d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
          return h("div",{key:i,style:{flex:1,minWidth:24,textAlign:"center",fontSize:7,color:i===snaps.length-1?"#C8A96E":"#5A5550",fontFamily:"monospace",fontWeight:i===snaps.length-1?"bold":"normal"}},lb);
        })
      ),
      ...CL.map(c=>h("div",{key:c.id,style:{display:"flex",alignItems:"center",gap:2,marginBottom:2}},
        h("div",{style:{width:40,flexShrink:0,fontSize:9,color:c.color,fontFamily:"monospace",fontWeight:"bold"}},c.tag),
        ...snaps.map((s,i)=>{
          const pct=s.composicao[c.id]||0;
          const inBand=pct>=c.min&&pct<=c.max;
          return h("div",{key:i,title:c.name+": "+pct.toFixed(1)+"% (alvo "+c.min+"-"+c.max+"%)",style:{flex:1,minWidth:24,height:22,background:colorFor(pct,c),borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7.5,color:"#0D0F14",fontFamily:"monospace",fontWeight:"bold",border:i===snaps.length-1?"1.5px solid #F0EAD8":"none"}},pct.toFixed(0));
        })
      ))
    ),
    // Legenda
    h("div",{style:{display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,marginTop:10,justifyContent:"center"}},
      ...[{c:"#A03030",l:"distante (abaixo)"},
          {c:"#C46045",l:"abaixo"},
          {c:"#3D9F6A",l:"dentro"},
          {c:"#D9C455",l:"acima"},
          {c:"#A05050",l:"muito acima"}].map((it,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:3}},
        h("div",{style:{width:12,height:10,background:it.c,borderRadius:2}}),
        h("span",{style:{fontSize:7.5,color:"#7A7570",fontFamily:"monospace"}},it.l)
      ))
    )
  );
}

    h("p",{style:{color:"#8A8070",fontSize:12,lineHeight:1.7,marginBottom:20,textAlign:"center",maxWidth:320}},
      "Toque no botao abaixo e cole a chave no campo que aparecer."
    ),
    h("button",{onClick:tryPrompt,style:{width:"100%",maxWidth:320,padding:"13px",background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,color:"#0D0F14",fontSize:13,fontWeight:700,cursor:"pointer"}},"Colar chave API ->")
  );
}

function App(){
  const [apiKey,setApiKeyS]=useState(gk);

  const [nLbl,setNLbl]=useState("");

  const [insightLoad,setInsightLoad]=useState(false);
  const [insightErr,setInsightErr]=useState("");

  useEffect(()=>{
    const dd=ld();
    if(dd){
      setPort(dd.port||{});setCustom(dd.custom||{});setHidden(dd.hidden||[]);
      setLastPU(dd.lastPU||null);setHist(dd.hist||[]);

  },[]);
  useEffect(()=>{if(!inited)return;sv({port,custom,hidden,lastPU,hist});},[port,custom,hidden,lastPU,hist,inited]);

  const {ccy,cls,lbl}=mkL(custom);
  const allT=useCallback((cid)=>[...(BASE[cid]||[]),...(custom[cid]||[]).map(a=>a.ticker)],[custom]);

  const stats=useCallback(()=>{
    let total=0;const ct={};CL.forEach(c=>{ct[c.id]=0;});
    Object.entries(port).forEach(([t,p])=>{const v=pv(t,p,ccy);if(!v)return;total+=v;const cid=p.classId||cls[t];if(cid)ct[cid]=(ct[cid]||0)+v;});
    const cw={};CL.forEach(c=>{cw[c.id]=total>0?(ct[c.id]/total)*100:0;});
    return {total,ct,cw};
  },[port,ccy,cls]);
  const {total,ct,cw}=stats();
  const hasPos=Object.entries(port).some(([t,p])=>hq(t,p));

  const refresh=useCallback(async()=>{
    const tickers=Object.keys(port).filter(t=>hq(t,port[t])&&!VB.includes(t));
    if(!tickers.length){setPErr("Nenhum ativo com quantidade cadastrada");return;}
    setLoadP(true);setPErr("");
    // Helper de fetch com timeout manual (compativel com todos os navegadores)
    const fetchJSON=async(url,ms)=>{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),ms||10000);
      try{
        const r=await fetch(url,{signal:ctrl.signal});
        if(!r.ok)throw new Error("HTTP "+r.status);
        return await r.json();
      }finally{clearTimeout(timer);}
    };
    // Helper que tenta varios proxies CORS em cascata ate algum funcionar
    const fetchViaProxy=async(targetUrl,ms)=>{
      const proxies=[
        u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
        u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
        u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u),
        u=>"https://proxy.cors.sh/"+u,
      ];
      let lastErr;
      for(const mk of proxies){
        try{return await fetchJSON(mk(targetUrl),ms);}
        catch(e){lastErr=e;}
      }
      throw lastErr||new Error("todos proxies falharam");
    };
    const dbg=[];
    try{
      const allPrices={};
      const failed=[];
      // Cambio - open.er-api.com (confirmado funcionando)
      try{
        const d=await fetchJSON("https://open.er-api.com/v6/latest/BRL",8000);
        if(d&&d.rates){
          let n=0;
          ["USD","EUR","GBP","CHF","JPY","AUD","HKD","SGD","NOK","DKK","MXN"].forEach(k=>{if(d.rates[k]>0){FX[k]=1/d.rates[k];n++;}});
          dbg.push("FX:"+n);
        }else dbg.push("FX:semrates");
      }catch(e){dbg.push("FX-erro:"+e.message);}
      // Ouro via Coinbase
      if(tickers.includes("OURO_FISICO")){
        try{
          const d=await fetchJSON("https://api.coinbase.com/v2/prices/XAU-USD/spot",8000);
          const g=parseFloat(d&&d.data&&d.data.amount);
          if(g>0){allPrices["OURO_FISICO"]=(g/31.1035)*FX.USD;dbg.push("Ouro:ok");}
          else{failed.push("OURO_FISICO");dbg.push("Ouro:semvalor");}
        }catch(e){failed.push("OURO_FISICO");dbg.push("Ouro-erro:"+e.message);}
      }
      // Bitcoin via CoinGecko
      if(tickers.includes("BTC")){
        try{
          const d=await fetchJSON("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd",8000);
          if(d.bitcoin&&d.bitcoin.usd>0){allPrices["BTC"]=d.bitcoin.usd;dbg.push("BTC:ok");}
          else{failed.push("BTC");dbg.push("BTC:semvalor");}
        }catch(e){failed.push("BTC");dbg.push("BTC-erro:"+e.message);}
      }
      // Mapeamento de tickers para Yahoo Finance
      const YH={
        MSFT:"MSFT",APH:"APH",MU:"MU",AMAT:"AMAT",GOOGL:"GOOGL",WM:"WM",O:"O",BRKB:"BRK-B",
        DHR:"DHR",PH:"PH",LIN:"LIN",ECL:"ECL",ADBE:"ADBE",PEP:"PEP",XOM:"XOM",AOS:"AOS",
        PANW:"PANW",CTVA:"CTVA",NDIA:"NDIA",AAAU:"AAAU",
        SIE:"SIE.DE",SAP:"SAP.DE",ASML:"ASML.AS",ABBN:"ABBN.SW",NSIS_B:"NOVO-B.CO",
        HLMA:"HLMA.L",KOG:"KOG.OL",GMEXICOB:"GMEXICOB.MX",
        TSE8058:"8058.T",TSE8031:"8031.T",REA:"REA.AX",WES:"WES.AX",
        HKG0700:"0700.HK",HKG1299:"1299.HK",HKG0001:"0001.HK",HKG0087:"0087.HK",J36:"J36.SI",
      };
      const isBR=t=>BCCY[t]==="BRL"&&!["OURO_FISICO","BTC","SELIC2031"].includes(t);
      const brTickers=tickers.filter(isBR);
      const fgnTickers=tickers.filter(t=>YH[t]);
      // Brasil - Yahoo Finance com sufixo .SA (B3) via proxy CORS
      if(brTickers.length){
        let brN=0;
        await Promise.all(brTickers.map(async t=>{
          try{
            const sym=t+".SA";
            const target="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?interval=1d&range=5d";
            const d=await fetchViaProxy(target,15000);
            const res=d&&d.chart&&d.chart.result&&d.chart.result[0];
            const p=res&&res.meta&&(res.meta.regularMarketPrice||res.meta.previousClose);
            if(typeof p==="number"&&p>0){allPrices[t]=p;brN++;}
          }catch{}
        }));
        dbg.push("BR:"+brN+"/"+brTickers.length);
        brTickers.forEach(t=>{if(!allPrices[t])failed.push(t);});
      }
      // Yahoo Finance - estrangeiros (em paralelo, com cascata de proxies CORS)
      if(fgnTickers.length){
        let yhN=0;
        await Promise.all(fgnTickers.map(async t=>{
          try{
            const sym=YH[t];
            const target="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?interval=1d&range=5d";
            const d=await fetchViaProxy(target,15000);
            const res=d&&d.chart&&d.chart.result&&d.chart.result[0];
            const p=res&&res.meta&&(res.meta.regularMarketPrice||res.meta.previousClose);
            if(typeof p==="number"&&p>0){allPrices[t]=p;yhN++;}
          }catch{}
        }));
        dbg.push("YH:"+yhN+"/"+fgnTickers.length);
      }
      // Stooq fallback
      const STQ={
        MSFT:"msft.us",APH:"aph.us",MU:"mu.us",AMAT:"amat.us",GOOGL:"googl.us",WM:"wm.us",
        O:"o.us",BRKB:"brk-b.us",DHR:"dhr.us",PH:"ph.us",LIN:"lin.us",ECL:"ecl.us",
        ADBE:"adbe.us",PEP:"pep.us",XOM:"xom.us",AOS:"aos.us",PANW:"panw.us",CTVA:"ctva.us",
        NDIA:"ndia.us",AAAU:"aaau.us",
        SIE:"sie.de",SAP:"sap.de",ASML:"asml.nl",ABBN:"abbn.ch",HLMA:"hlma.uk",KOG:"kog.no",
        GMEXICOB:"gmexicob.mx",
      };
      const stqMissing=fgnTickers.filter(t=>!allPrices[t]&&STQ[t]);
      if(stqMissing.length){
        let sqN=0;
        await Promise.all(stqMissing.map(async t=>{
          try{
            const target="https://stooq.com/q/l/?s="+STQ[t]+"&f=sd2t2ohlcv&h&e=json";
            const d=await fetchViaProxy(target,12000);
            const sym=d&&d.symbols&&d.symbols[0];
            const p=sym&&parseFloat(sym.close);
            if(p>0){allPrices[t]=p;sqN++;}
          }catch{}
        }));
        dbg.push("STQ:"+sqN+"/"+stqMissing.length);
      }
      fgnTickers.forEach(t=>{if(!allPrices[t])failed.push(t);});
      const SCALE10=["ALZR11","RBVA11","TEPP11"];
      SCALE10.forEach(t=>{if(allPrices[t]&&allPrices[t]>500)allPrices[t]=allPrices[t]/10;});
      const n=Object.keys(allPrices).length;
      if(n>0){
        setPort(prev=>{const np={...prev};Object.entries(allPrices).forEach(([t,v])=>{if(np[t])np[t]={...np[t],price:v};});return np;});
        setLastPU(new Date().toISOString());
        if(n<tickers.length){
          const uniq=[...new Set(failed)].filter(t=>!allPrices[t]);
          setPErr("Parcial: "+n+"/"+tickers.length+" ["+dbg.join(" ")+"]"+(uniq.length?" falhou: "+uniq.slice(0,5).join(","):""));
        }
      } else {setPErr("Sem cotacoes ["+dbg.join(" ")+"]");}
    }catch(e){setPErr("Erro: "+e.message+" ["+dbg.join(" ")+"]");}
    setLoadP(false);
  },[port]);

  const openEdit=(ticker,classId)=>{
    const p=port[ticker]||{};setEditA({ticker,classId});
    if(VB.includes(ticker)){setEQty(p.totalBRL!=null?String(p.totalBRL):"");setEPrice("");}
    else{setEQty(p.qty!=null?String(p.qty):"");setEPrice(p.price!=null?String(p.price):"");}
  };
  const saveEdit=()=>{
    if(!editA)return;const{ticker,classId}=editA;
    if(VB.includes(ticker)){const v=pN(eQty);setPort(prev=>({...prev,[ticker]:{...prev[ticker],classId,totalBRL:v,qty:1,price:v}}));}
    else{const qty=pN(eQty),price=pN(ePrice);setPort(prev=>({...prev,[ticker]:{...prev[ticker],classId,qty,price}}));}
    setEditA(null);
  };
  const removePos=t=>{setPort(prev=>{const n={...prev};delete n[t];return n;});setEditA(null);};
  const toggleHide=t=>{setHidden(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t]);setEditA(null);};
  const addCustom=cid=>{
    const t=nTick.trim().toUpperCase();if(!t)return;
    if(allT(cid).includes(t)){alert("Ja existe");return;}
    setCustom(prev=>({...prev,[cid]:[...(prev[cid]||[]),{ticker:t,label:nLbl.trim()||t,ccy:nCcy}]}));
    BCCY[t]=nCcy;setAddTo(null);setNTick("");setNLbl("");setNCcy("BRL");
  };
  const removeCustom=(cid,t)=>{setCustom(prev=>({...prev,[cid]:(prev[cid]||[]).filter(a=>a.ticker!==t)}));removePos(t);};

  const genAlloc=async()=>{
    const v=pN(apV);if(v<=0)return;
    setLoadA(true);setAErr("");
    try{
      const ci=CL.map(c=>({id:c.id,name:c.name,min:c.min,max:c.max,peso:cw[c.id]||0,
        ativos:allT(c.id).map(t=>{const p=port[t],cc=ccy[t]||"BRL";
          if(VB.includes(t))return{ticker:t,moeda:"BRL",valorBRL:p?p.totalBRL||0:0};
          if(GB.includes(t))return{ticker:t,moeda:"BRL/g",valorBRL:p?(p.qty||0)*(p.price||0):0};
          return p?{ticker:t,moeda:cc,qtd:p.qty,preco:p.price||0,valorBRL:(p.qty||0)*(p.price||0)*(FX[cc]||1)}:{ticker:t,moeda:cc};
        }).slice(0,7)
      }));
      const msg="Analista Buy&Hold aposentadoria rigoroso. PORTFOLIO:"+JSON.stringify(ci)+"\\nAPORTE:R$"+v+"\\nPATRIMONIO_TOTAL:R$"+Math.round(total)+"\\nRegras: zero vendas, todas 7 classes recebem min 2%, priorizar classes abaixo do alvo. NENHUM ativo individual pode passar de 5% do patrimonio total apos o aporte. FIIs: P/VPA<=0.97 DY>=9%. Ciclicas: P/L<=10x. Compounders: P/L<=18x. Exterior value: P/L<=18x. Infra: DY>=9.5%.\\nApos sugerir, AVALIE CRITICAMENTE o proprio aporte em 3 dimensoes: (1) eficiencia_rebalanceamento (o aporte realmente aproxima classes do alvo?), (2) margem_seguranca_valuation (os tickers escolhidos tem precos atrativos?), (3) limite_5pct (nenhum ticker passa de 5% do patrimonio?).\\nJSON sem markdown: {resumo:...,alertas:[],classes:[{id:fii,pct:25,valor:2500,ativos:[{ticker:HGLG11,score:COMPRA FORTE,metricas:P/VPA 0.91}]}],veredito:{eficiencia:{nota:OTIMO|BOM|REGULAR|RUIM,texto:explicacao curta},valuation:{nota:OTIMO|BOM|REGULAR|RUIM,texto:explicacao},limite5pct:{ok:true|false,texto:explicacao}}}";
      const txt=await callAPI([{role:"user",content:msg}],apiKey);
      const res=JSON.parse(txt);
      setApR({...res,apValue:v});setStep("r");
      const ent={};(res.classes||[]).forEach(cl=>(cl.ativos||[]).forEach(a=>{ent[a.ticker]={qty:"",price:port[a.ticker]&&port[a.ticker].price?String(port[a.ticker].price):"",done:false};}));
      setExecE(ent);
    }catch(e){setAErr(e.message||"Erro");}
    setLoadA(false);
  };

  const applyExec=()=>{
    const buys=Object.entries(execE).filter(([,v])=>v.done&&pN(v.qty)>0&&pN(v.price)>0);
    if(!buys.length)return;
    const newPort={...port};
    buys.forEach(([t,v])=>{const aq=pN(v.qty),ap=pN(v.price),cid=cls[t]||newPort[t]&&newPort[t].classId,old=newPort[t]||{};newPort[t]={...old,classId:cid,qty:(old.qty||0)+aq,price:ap};});
    setPort(newPort);
    const totalBRL=Object.entries(newPort).reduce((s,[t,p])=>s+pv(t,p,ccy),0);
    // Calcula composicao percentual por classe no momento
    const compPct={};
    CL.forEach(c=>{compPct[c.id]=0;});
    Object.entries(newPort).forEach(([t,p])=>{
      const v=pv(t,p,ccy);if(!v)return;
      const cid=p.classId||cls[t];if(cid)compPct[cid]=(compPct[cid]||0)+v;
    });
    CL.forEach(c=>{compPct[c.id]=totalBRL>0?(compPct[c.id]/totalBRL)*100:0;});
    setHist(prev=>[{date:new Date().toISOString(),apValue:apR.apValue,
      purchases:buys.map(([t,v])=>({ticker:t,qty:pN(v.qty),price:pN(v.price),total:pN(v.qty)*pN(v.price)})),
      totalExecuted:buys.reduce((s,[,v])=>s+pN(v.qty)*pN(v.price),0),
      totalPatrimBRL:totalBRL,totalPatrimUSD:totalBRL/(FX.USD||5.8),
      composicao:compPct
    },...prev].slice(0,24));
    setStep("done");
  };

  // Tambem grava snapshot quando atualiza precos (para o heatmap mostrar evolucao)
  const gravaSnapshot=useCallback(()=>{
    if(!hasPos||total<=0)return;
    const compPct={};
    CL.forEach(c=>{compPct[c.id]=cw[c.id]||0;});
    setHist(prev=>{
      const last=prev[0];
      // Evita duplicar: so grava se ultimo registro tem >1h ou nao tem composicao
      if(last&&last.composicao&&new Date()-new Date(last.date)<3600000)return prev;
      return [{date:new Date().toISOString(),apValue:0,totalExecuted:0,
        totalPatrimBRL:total,totalPatrimUSD:total/(FX.USD||5.8),
        composicao:compPct,snapshot:true
      },...prev].slice(0,48);
    });
  },[hasPos,total,cw]);

  const sendChat=async msg=>{
    if(!msg.trim())return;
    setChatM(prev=>[...prev,{role:"user",content:msg}]);setChatIn("");setChatL(true);
    const portCtx=Object.entries(port).filter(([t,p])=>pv(t,p,ccy)>0).map(([t,p])=>({t,cls:cls[t],v:Math.round(pv(t,p,ccy))})).sort((a,b)=>b.v-a.v).slice(0,10);
    const allocCtx=apR?{valor:apR.apValue,resumo:apR.resumo}:null;
    const h8=chatM.slice(-8);
    const prompt="Analista patrimonial senior Buy&Hold aposentadoria. PORTFOLIO:"+JSON.stringify(portCtx)+(allocCtx?"\\nULTIMA ANALISE:"+JSON.stringify(allocCtx):".")+"\\nResponda direto, max 4 paragrafos.\\nHistorico:\\n"+h8.map(m=>(m.role==="user"?"Investidor: ":"Analista: ")+m.content).join("\\n")+"\\nPergunta: "+msg;
    try{
      const txt=await callAPI([{role:"user",content:prompt}],apiKey);
      setChatM(prev=>[...prev,{role:"assistant",content:txt}]);
    }catch(e){setChatM(prev=>[...prev,{role:"assistant",content:"Erro: "+e.message}]);}
    setChatL(false);
  };

  // Gerar insight automatico do dashboard
  const genInsight=useCallback(async(forcar)=>{
    if(!apiKey)return;
    if(insightLoad)return;
    if(!hasPos)return;
    // Soma posicoes ponderadas por classe e risco/retorno
    let totW=0,wR=0,wE=0;
    CL.forEach(c=>{const p=RR[c.id],w=cw[c.id]||0;if(p&&w>0){totW+=w;wR+=p.r*w;wE+=p.e*w;}});
    const portR=totW>0?wR/totW:0,portE=totW>0?wE/totW:0;
    // Exposicao cambial
    const byCcy={};
    Object.entries(port).forEach(([t,p])=>{
      if(!p)return;const v=pv(t,p,ccy);if(!v)return;
      let c=BCCY[t]||"BRL";if(GB.includes(t))c="BRL";
      byCcy[c]=(byCcy[c]||0)+v;
    });
    const ccyPct={};const totalCcy=Object.values(byCcy).reduce((s,v)=>s+v,0);
    Object.entries(byCcy).forEach(([c,v])=>{ccyPct[c]=((v/totalCcy)*100).toFixed(1)+"%";});
    const composicao={};CL.forEach(c=>{composicao[c.tag]=(cw[c.id]||0).toFixed(1)+"%";});
    const status={};CL.forEach(c=>{const w=cw[c.id]||0;status[c.tag]=w<c.min?"abaixo":w>c.max&&!c.flex?"acima":"ok";});
    const prompt="Analista patrimonial senior Buy&Hold para aposentadoria.\\n"+
      "COMPOSICAO ATUAL: "+JSON.stringify(composicao)+"\\n"+
      "STATUS por classe (vs bandas alvo): "+JSON.stringify(status)+"\\n"+
      "RISCO ponderado do portfolio: "+portR.toFixed(2)+"/10\\n"+
      "RETORNO esperado ponderado: "+portE.toFixed(2)+"/10\\n"+
      "EXPOSICAO CAMBIAL: "+JSON.stringify(ccyPct)+"\\n"+
      "Patrimonio total: R$ "+Math.round(total)+"\\n\\n"+
      "Gere um insight CURTO (3 paragrafos, max 80 palavras CADA) sobre:\\n"+
      "1) Diagnostico da composicao atual (quais distorcoes principais)\\n"+
      "2) Como OTIMIZAR a relacao risco x retorno (acoes concretas)\\n"+
      "3) Riscos cambiais ou de concentracao relevantes\\n\\n"+
      "Tom: direto, objetivo, sem rodeios. Sem markdown. Use paragrafos separados por linha em branco.";
    setInsightLoad(true);setInsightErr("");
    try{
      const txt=await callAPI([{role:"user",content:prompt}],apiKey);
      setInsight(txt);
      try{localStorage.setItem("pat-insight",txt);localStorage.setItem("pat-insight-ts",String(Date.now()));}catch{}
    }catch(e){setInsightErr(e.message);}
    setInsightLoad(false);
  },[apiKey,hasPos,cw,port,ccy,total,insightLoad]);

  // Gera automaticamente: na 1a vez (sem cache) ou quando lastPU muda
  useEffect(()=>{
    if(!inited||!apiKey||!hasPos)return;
    let lastTs=0;try{lastTs=parseInt(localStorage.getItem("pat-insight-ts")||"0");}catch{}
    const lastPUTs=lastPU?new Date(lastPU).getTime():0;
    // Gera se: nao tem insight OU lastPU e mais recente que o insight
    if(!insight||(lastPUTs>lastTs&&lastPUTs>0)){
      genInsight();
    }
  },[inited,apiKey,hasPos,lastPU]);

  // Grava snapshot da composicao quando atualiza precos (para heatmap)
  useEffect(()=>{
    if(!inited||!hasPos||!lastPU)return;
    gravaSnapshot();
  },[lastPU,inited]);
