// Premissas BASE de risco e retorno por classe (escala 0-10)
// Valores ancorados em cenario Selic = 10% a.a. (normalizada)
const RR_BASE={fii:{r:3.5,e:7.5},acoes_br:{r:6.5,e:8.5},acoes_ext:{r:5.5,e:8.0},reits:{r:4.5,e:7.2},selic:{r:1.0,e:4.5},ouro:{r:4.0,e:5.5},bitcoin:{r:9.5,e:9.0},infra:{r:2.5,e:7.0},imoveis:{r:2.0,e:6.0},agro:{r:3.0,e:8.0}};
const SELIC_ANCORA=10;// Selic % a.a. considerada na premissa base
// RR efetivo: comeca como base, depois eh recalibrado por Selic + IA
// Mutavel apenas via funcao recalibrarRR (nao mutar diretamente)
let RR={...RR_BASE};
// Recalibra RR a partir da Selic atual e (opcional) ajustes da IA
// Premissa: SEL tem 'e' linear na Selic; outras classes ajustam 'e' por premio de risco
function recalibrarRR(selicAtual,ajustesIA){
  const sel=typeof selicAtual==="number"&&selicAtual>0?selicAtual:SELIC_ANCORA;
  const delta=sel-SELIC_ANCORA;// quanto a Selic mudou vs ancora
  // Funcao auxiliar pra clampar entre 0.5 e 10
  const c=(v)=>Math.max(0.5,Math.min(10,v));
  // Selic: 'e' = 4.5 + (selic-10)*0.45 (saturando entre 1 e 10)
  // Selic 5% -> e=2.25; Selic 10% -> e=4.5; Selic 15% -> e=6.75; Selic 20% -> e=9
  // Risco da Selic muda pouco (titulo soberano), so leve aumento se Selic for muito alta (Selic 20 ja indica stress)
  const novoSelE=c(RR_BASE.selic.e+delta*0.45);
  const novoSelR=c(RR_BASE.selic.r+Math.max(0,delta-5)*0.2);
  // Para classes de renda fixa/dividend (FII, infra, imoveis): retorno relativo cai um pouco quando Selic sobe muito (premio reduzido)
  // Mas risco aumenta um pouco (custo de oportunidade maior, marcacao a mercado fica pior)
  // Sensibilidade pequena - sao buy & hold de longo prazo
  const ajusteRendaFixa=delta*0.10;// se Selic sobe 5pp, e cai 0.5; risco sobe 0.3
  const novoFiiE=c(RR_BASE.fii.e-ajusteRendaFixa);
  const novoFiiR=c(RR_BASE.fii.r+ajusteRendaFixa*0.6);
  const novoInfE=c(RR_BASE.infra.e-ajusteRendaFixa);
  const novoInfR=c(RR_BASE.infra.r+ajusteRendaFixa*0.6);
  const novoImvE=c(RR_BASE.imoveis.e-ajusteRendaFixa*0.5);
  const novoImvR=c(RR_BASE.imoveis.r+ajusteRendaFixa*0.3);
  const novoAgroE=c(RR_BASE.agro.e-ajusteRendaFixa);
  const novoAgroR=c(RR_BASE.agro.r+ajusteRendaFixa*0.5);
  // Acoes brasileiras: Selic alta = custo de capital alto = retorno esperado cai, risco sobe (cenario macro pesa)
  const novoBrE=c(RR_BASE.acoes_br.e-delta*0.20);
  const novoBrR=c(RR_BASE.acoes_br.r+delta*0.15);
  // Acoes exteriores: pouco impacto da Selic BR (diferencial cambial pode ate beneficiar com Selic alta atraindo capital)
  const novoExtE=c(RR_BASE.acoes_ext.e);
  const novoExtR=c(RR_BASE.acoes_ext.r);
  // REITs americanos: similares a EXT em sensibilidade a Selic BR (baixa), mas com leve viés dividend (sofre um pouco quando Selic BR alta cria custo de oportunidade local)
  const novoReitE=c(RR_BASE.reits.e-Math.max(0,delta)*0.08);
  const novoReitR=c(RR_BASE.reits.r+Math.max(0,delta)*0.05);
  // Ouro: hedge - retorno esperado pouco sensivel, risco neutro
  const novoOuroE=c(RR_BASE.ouro.e);
  const novoOuroR=c(RR_BASE.ouro.r);
  // Bitcoin: classe especulativa, premissas inalteradas pela Selic
  const novoBtcE=c(RR_BASE.bitcoin.e);
  const novoBtcR=c(RR_BASE.bitcoin.r);
  // Constroi novo RR
  const novo={
    fii:{r:novoFiiR,e:novoFiiE},
    acoes_br:{r:novoBrR,e:novoBrE},
    acoes_ext:{r:novoExtR,e:novoExtE},
    reits:{r:novoReitR,e:novoReitE},
    selic:{r:novoSelR,e:novoSelE},
    ouro:{r:novoOuroR,e:novoOuroE},
    bitcoin:{r:novoBtcR,e:novoBtcE},
    infra:{r:novoInfR,e:novoInfE},
    imoveis:{r:novoImvR,e:novoImvE},
    agro:{r:novoAgroR,e:novoAgroE}
  };
  // Sobrescreve com ajustes da IA (se fornecidos)
  if(ajustesIA&&typeof ajustesIA==="object"){
    Object.keys(novo).forEach(k=>{
      if(ajustesIA[k]&&typeof ajustesIA[k]==="object"){
        if(typeof ajustesIA[k].r==="number")novo[k].r=c(ajustesIA[k].r);
        if(typeof ajustesIA[k].e==="number")novo[k].e=c(ajustesIA[k].e);
      }
    });
  }
  RR=novo;
  return novo;
}

const SK_OLD="pat-v9";       // legado nao criptografado (para migracao)
const SK_ENC="pat-v10-enc";   // novo: dados criptografados
const SK_SALT="pat-v10-salt"; // salt PBKDF2 (publico)
const SK_PIN="pat-v10-pin";   // hash SHA-256 do PIN (validacao rapida)
const SK_ATT="pat-v10-att";   // tentativas erradas {n, lockUntil}
const SK_KEY="pat-key-enc";   // API key Anthropic criptografada
const SK_BRAPI="pat-brapi-enc";// token Brapi criptografado
const SK_BG="pat-bg-enc";// API key BGeometrics (MVRV-Z) criptografada

// === Web Crypto helpers ===
const _enc=new TextEncoder();
const _dec=new TextDecoder();
const _b64=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const _b64d=(s)=>{const bin=atob(s);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;};
async function sha256Hex(s){
  const h=await crypto.subtle.digest("SHA-256",_enc.encode(s));
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function getSaltOrCreate(){
  let s=localStorage.getItem(SK_SALT);
  if(!s){
    const arr=crypto.getRandomValues(new Uint8Array(16));
    s=_b64(arr);
    localStorage.setItem(SK_SALT,s);
  }
  return _b64d(s);
}
async function deriveKey(pin){
  const salt=getSaltOrCreate();
  const baseKey=await crypto.subtle.importKey("raw",_enc.encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},
    baseKey,
    {name:"AES-GCM",length:256},
    false,
    ["encrypt","decrypt"]
  );
}
async function aesEncrypt(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=_enc.encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);
  return _b64(iv)+":"+_b64(ct);
}
async function aesDecrypt(key,blob){
  const [ivB64,ctB64]=blob.split(":");
  const iv=_b64d(ivB64);
  const ct=_b64d(ctB64);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(_dec.decode(pt));
}

// Carrega API key (criptografada com a mesma chave)
async function loadApiKey(aesKey){
  try{
    const enc=localStorage.getItem(SK_KEY);
    if(!enc)return "";
    return await aesDecrypt(aesKey,enc);
  }catch{return "";}
}
async function saveApiKey(aesKey,plainKey){
  try{
    if(!plainKey){localStorage.removeItem(SK_KEY);return;}
    const enc=await aesEncrypt(aesKey,plainKey);
    localStorage.setItem(SK_KEY,enc);
  }catch{}
}

  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="portfolio_backup_"+new Date().toISOString().slice(0,10)+".json";

}

function mkL(cu){
  const ccy={...BCCY},cls={},lbl={...NAMES};
  Object.entries(BASE).forEach(([cid,ts])=>ts.forEach(t=>{cls[t]=cid;}));
  Object.entries(cu||{}).forEach(([cid,list])=>{
    (list||[]).forEach(a=>{ccy[a.ticker]=a.ccy||"BRL";cls[a.ticker]=cid;lbl[a.ticker]=a.label||a.ticker;});
  });
  return {ccy,cls,lbl};
}
const isImv=t=>typeof t==="string"&&t.startsWith("IMV_");
function pv(t,p,ccy){
  if(!p)return 0;
  if(VB.includes(t)||isImv(t))return p.totalBRL||0;
  if(GB.includes(t))return(p.qty||0)*(p.price||0);
  return(p.qty||0)*(p.price||0)*(FX[ccy[t]||"BRL"]||1);
}
function hq(t,p){if(!p)return false;if(VB.includes(t)||isImv(t))return(p.totalBRL||0)>0;return(p.qty||0)>0;}
const fB=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fN=(v,d=2)=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=v=>(v||0).toFixed(1)+"%";
const pN=s=>parseFloat(String(s).replace(",","."))||0;

async function callAPI(messages,key){
  const body={model:"claude-sonnet-4-6",max_tokens:1500,messages};
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||d.error.type);
  return d.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
}

function AllocChart({cw,ct,fB,MV,hideVal}){
  const W=300,H=215,pL=30,pB=72,pT=34,pR=8,cW=W-pL-pR,cH=H-pB-pT;
  // Limite Y dinamico mas com piso minimo + teto folgado para evitar barras tocando o topo
  const maxPos=Math.max(...CL.map(c=>cw[c.id]||0));
  const mx=Math.max(35,Math.ceil(maxPos*1.18/5)*5);
  const gridLines=[];
  const step=mx<=40?10:mx<=70?15:20;
  for(let v=0;v<=mx-step;v+=step)gridLines.push(v);
  if(!gridLines.includes(0))gridLines.unshift(0);
  const bW=Math.floor(cW/CL.length)-3;
  // Funcao auxiliar para formatar valor BRL de forma compacta
  // Ex: 4.375.179 -> "4,4M"; 220.000 -> "220K"; 1.115.152 -> "1,1M"
  const fmtCompacto=(v)=>{
    if(!v||v<=0)return "R$ 0";
    if(v>=1e6)return "R$ "+(v/1e6).toFixed(v>=1e7?1:2).replace(".",",")+"M";
    if(v>=1e3)return "R$ "+Math.round(v/1e3)+"K";
    return "R$ "+Math.round(v);
  };
  return h("div",{style:{marginBottom:20}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Alocacao atual vs alvo"),
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",overflow:"hidden"}},
      ...gridLines.map(v=>{
        const y=pT+cH-(v/mx)*cH;

      }),
      ...CL.map((c,i)=>{
        const w=cw[c.id]||0,sW=cW/CL.length,x=pL+i*sW+(sW-bW)/2;
        const bH=Math.max((w/mx)*cH,1),y=pT+cH-bH;
        const st=w<c.min?"u":w>c.max?"o":"k";
        const fill=st==="u"?"#E05252":st==="o"?"#E8C44A":c.color;
        const xm=x+bW/2;
        const yMin=pT+cH-(c.min/mx)*cH;
        const yMax=pT+cH-(Math.min(c.max,mx)/mx)*cH;
        const bandaH=yMin-yMax;
        const foraBanda=st!=="k";
        const desvio=st==="u"?(c.min-w):st==="o"?(w-c.max):0;
        const setaTxt=st==="u"?"\u2193":st==="o"?"\u2191":"";
        const yTriangulo=pT-12;

        // Valor BRL formatado (mascarado se hideVal)
        const valorClasse=ct&&ct[c.id]?ct[c.id]:0;
        const valorTxt=hideVal?"R$ ***":fmtCompacto(valorClasse);
        return h(Fragment,{key:c.id},
          h("rect",{x:xm-bW*.6,y:yMax,width:bW*1.2,height:bandaH,fill:c.color,fillOpacity:"0.06",stroke:"none"}),
          h("line",{x1:xm-bW*.6,y1:yMin,x2:xm+bW*.6,y2:yMin,stroke:c.color,strokeWidth:"1",strokeOpacity:".55",strokeDasharray:"3,2"}),
          h("line",{x1:xm-bW*.6,y1:yMax,x2:xm+bW*.6,y2:yMax,stroke:c.color,strokeWidth:"1",strokeOpacity:".55",strokeDasharray:"3,2"}),
          h("rect",{x,y,width:bW,height:bH,fill,fillOpacity:".50",stroke:fill,strokeWidth:"0.8",strokeOpacity:".9",rx:"2"}),
          h("text",{x:xm,y:y-3,textAnchor:"middle",fill,fontSize:"6.5",fontFamily:"monospace",fontWeight:"700"},w.toFixed(1)),

function CompareChart({cw}){
  // Radar/polygon chart: actual vs target for each class - versao clean
  const W=340,H=290,cx=170,cy=140,maxR=95;
  const n=CL.length;
  function polarPt(i,r){
    const angle=(i/n)*2*Math.PI - Math.PI/2;
    return {x:cx+r*Math.cos(angle), y:cy+r*Math.sin(angle)};
  }
  const grids=[0.33,0.66,1.0];
  const maxPct=Math.max(35,...CL.map(c=>cw[c.id]||0));
  const actualPts=CL.map((c,i)=>{
    const pct=cw[c.id]||0;
    return polarPt(i,(pct/maxPct)*maxR);
  });
  const targetPts=CL.map((c,i)=>{
    const pct=(c.min+c.max)/2;
    return polarPt(i,(pct/maxPct)*maxR);
  });
  // Posicoes dos labels (mais espacadas)
  const labelPts=CL.map((c,i)=>polarPt(i,maxR+22));

      ...grids.map((g,gi)=>{

function CurrencyChart({port,cls,hideVal}){
  // Calcula exposicao por moeda (em BRL)
  const byCcy={};
  Object.entries(port||{}).forEach(([t,p])=>{
    if(!p)return;
    const v=pv(t,p,(()=>{const c={};Object.keys(BCCY).forEach(k=>c[k]=BCCY[k]);return c;})());
    if(!v)return;
    // Ouro fisico e Bitcoin viram USD na pratica (cotados em USD)
    let ccy=BCCY[t]||"BRL";
    if(GB.includes(t))ccy="BRL"; // ouro fisico comprado em reais
    byCcy[ccy]=(byCcy[ccy]||0)+v;
  });
  const total=Object.values(byCcy).reduce((a,b)=>a+b,0);
  if(total<=0)return null;
  // Ordena por valor desc
  const entries=Object.entries(byCcy).sort((a,b)=>b[1]-a[1]);
  // Cores por moeda
  const COL={BRL:"#4CAF82",USD:"#5B8FD4",EUR:"#C8A96E",GBP:"#9B7EBD",CHF:"#E05252",
    JPY:"#E8C44A",AUD:"#FF9F40",HKD:"#FF6B9D",SGD:"#4DD0E1",NOK:"#8DA9C4",DKK:"#A8C4A2",MXN:"#D17A22"};
  const NAME={BRL:"Real",USD:"Dolar EUA",EUR:"Euro",GBP:"Libra",CHF:"Franco Suico",
    JPY:"Iene",AUD:"Dolar Australiano",HKD:"Dolar HK",SGD:"Dolar Singapura",
    NOK:"Coroa Norueguesa",DKK:"Coroa Dinamarquesa",MXN:"Peso Mexicano"};
  // Donut SVG
  const W=300,H=180,cx=W/2,cy=H/2,rOut=62,rIn=38;
  let acc=0;
  const slices=entries.map(([ccy,v])=>{
    const frac=v/total,a0=acc*2*Math.PI-Math.PI/2;
    acc+=frac;
    const a1=acc*2*Math.PI-Math.PI/2;
    const large=frac>0.5?1:0;
    const x0=cx+rOut*Math.cos(a0),y0=cy+rOut*Math.sin(a0);
    const x1=cx+rOut*Math.cos(a1),y1=cy+rOut*Math.sin(a1);
    const x2=cx+rIn*Math.cos(a1),y2=cy+rIn*Math.sin(a1);
    const x3=cx+rIn*Math.cos(a0),y3=cy+rIn*Math.sin(a0);
    const d="M"+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+rOut+" "+rOut+" 0 "+large+" 1 "+x1.toFixed(1)+" "+y1.toFixed(1)+" L"+x2.toFixed(1)+" "+y2.toFixed(1)+" A"+rIn+" "+rIn+" 0 "+large+" 0 "+x3.toFixed(1)+" "+y3.toFixed(1)+" Z";
    return {d,ccy,v,frac,color:COL[ccy]||"#8A8070"};
  });
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Exposicao Cambial"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Distribuicao do patrimonio por moeda"),
    // Donut
    h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",maxWidth:280,display:"block",margin:"0 auto"}},
      ...slices.map((s,i)=>h("path",{key:i,d:s.d,fill:s.color,fillOpacity:0.85,stroke:"#0D0F14",strokeWidth:"1.5"})),
      h("text",{x:cx,y:cy-3,textAnchor:"middle",fill:"#8A8070",fontSize:"8",fontFamily:"monospace"},entries.length+" moeda"+(entries.length>1?"s":"")),
      h("text",{x:cx,y:cy+9,textAnchor:"middle",fill:"#C8A96E",fontSize:"10",fontFamily:"monospace",fontWeight:"bold"},hideVal?"----":fB(total).replace("R$ ",""))
    ),
    // Barras horizontais
    h("div",{style:{marginTop:14}},
      ...entries.map(([ccy,v])=>{
        const pct=(v/total)*100,color=COL[ccy]||"#8A8070";
        return h("div",{key:ccy,style:{marginBottom:10}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,fontSize:10,fontFamily:"monospace"}},
            h("span",{style:{color:color,fontWeight:"bold"}},ccy+" "+(NAME[ccy]||"")),
            h("span",{style:{color:"#8A8070"}},pc(pct)+(hideVal?"":"  "+fB(v)))
          ),
          h("div",{style:{height:6,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden"}},
            h("div",{style:{height:"100%",width:pct.toFixed(1)+"%",background:color,opacity:0.85,borderRadius:3}})
          )
        );
      })
    )
  );
}

function RiskChart({cw,selicAtual,calibracaoRR_TS,calibracaoRR_texto,calibracaoRR_selic,recalibrarRR_viaIA,calibracaoLoad,calibracaoErr,hasAjustesIA,apiKey}){

  CL.forEach(c=>{const p=RR[c.id],w=cw[c.id]||0;if(p&&w>0){totW+=w;wR+=p.r*w;wE+=p.e*w;}});
  const portR=totW>0?wR/totW:null,portE=totW>0?wE/totW:null;

          h("feOffset",{dx:"0",dy:"1",result:"offsetblur"}),
          h("feFlood",{floodColor:"#000",floodOpacity:"0.6"}),

          h("feMerge",{},h("feMergeNode",{}),h("feMergeNode",{in:"SourceGraphic"}))
        )
      ),
      // ZONAS DE EFICIENCIA: areas sombreadas + linhas tracejadas
      ...(()=>{
        const zonas=[
          {min:0,max:1.0,cor:"#E05252",fill:"rgba(224,82,82,0.05)",nome:"DESFAVORAVEL"},
          {min:1.0,max:1.2,cor:"#E89060",fill:"rgba(232,144,96,0.05)",nome:"EQUILIBRADA"},

          {min:1.8,max:99,cor:"#4CAF82",fill:"rgba(76,175,130,0.06)",nome:"EXCELENTE"}
        ];
        const elements=[];
        zonas.forEach((z,idx)=>{
          const pts=[];
          pts.push(pL+","+(pT+cH));
          if(z.min===0){
            pts.push((pL+cW)+","+(pT+cH));
            const xMaxLinha=Math.min(10,10/z.max);
            const yMaxLinha=z.max*xMaxLinha;
            pts.push((pL+(xMaxLinha/10)*cW)+","+(pT+cH-(yMaxLinha/10)*cH));
          }else if(z.max>10){
            const xMaxMin=Math.min(10,10/z.min);

        // DESFAVORAVEL: no canto inferior direito
        // Calcula onde cada linha de razao toca o topo (y=10) ou a direita (x=10)
        const labelsTopo=[
          {nome:"EXCELENTE",cor:"#4CAF82",razao:1.8},// linha 1.8 -> toca topo em x=10/1.8=5.55

      // Grade extra-sutil

          const agora=Date.now();

          }else if((diasDesde<120)&&(deltaSelic===null||deltaSelic<1.5)){

            h("span",{style:{fontSize:8,color:ratio>=1.0&&ratio<1.2?"#0D0F14":"#E89060",background:ratio>=1.0&&ratio<1.2?"#E89060":"transparent",border:"1px solid #E8906055",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontWeight:ratio>=1.0&&ratio<1.2?700:400}},"1.0-1.2 equil"),

            h("span",{style:{fontSize:8,color:ratio>=1.5&&ratio<1.8?"#0D0F14":"#7AC494",background:ratio>=1.5&&ratio<1.8?"#7AC494":"transparent",border:"1px solid #7AC49455",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontWeight:ratio>=1.5&&ratio<1.8?700:400}},"1.5-1.8 otima"),
            h("span",{style:{fontSize:8,color:ratio>=1.8?"#0D0F14":"#4CAF82",background:ratio>=1.8?"#4CAF82":"transparent",border:"1px solid #4CAF8255",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontWeight:ratio>=1.8?700:400}},"1.8+ excel")
          ),
          // Descricao de cada zona (o que esperar)
          h("div",{style:{marginTop:9,paddingTop:7,borderTop:"1px dashed rgba(255,255,255,0.05)"}},
            h("div",{style:{fontSize:7,color:"#7A7060",fontFamily:"monospace",letterSpacing:2,marginBottom:5}},"O QUE ESPERAR DE CADA ZONA"),
            ...[
              {tag:"<1.0",nome:"DESFAV",cor:"#E05252",ativa:ratio<1.0,desc:"Risco assumido nao remunerado. Mais perda potencial do que ganho esperado por unidade de risco. Configuracao a evitar - revisar alocacao."},
              {tag:"1.0-1.2",nome:"EQUIL",cor:"#E89060",ativa:ratio>=1.0&&ratio<1.2,desc:"Retorno apenas acompanha o risco. Combinacao aceitavel mas sem alavancagem de eficiencia. Espaco amplo para otimizacao."},
              {tag:"1.2-1.5",nome:"BOA",cor:"#E8C44A",ativa:ratio>=1.2&&ratio<1.5,desc:"Retorno justifica o risco com folga modesta. Posicao saudavel mas nao otimizada. Pequenos ajustes podem subir para zona OTIMA."},
              {tag:"1.5-1.8",nome:"OTIMA",cor:"#7AC494",ativa:ratio>=1.5&&ratio<1.8,desc:"Voce captura retorno superior por unidade de risco assumido. Combinacao favoravel para Buy & Hold de longo prazo."},
              {tag:"1.8+",nome:"EXCEL",cor:"#4CAF82",ativa:ratio>=1.8,desc:"Eficiencia maxima - retorno potencial significativamente superior ao risco assumido. Manter disciplina de aportes dentro das bandas-alvo para preservar a posicao."}
            ].map((z,i)=>h("div",{key:i,style:{display:"flex",gap:6,marginBottom:i===4?0:4,padding:"3px 5px",borderRadius:3,background:z.ativa?z.cor+"12":"transparent",border:z.ativa?"1px solid "+z.cor+"33":"1px solid transparent"}},
              h("span",{style:{minWidth:62,fontSize:7,color:z.cor,fontFamily:"monospace",fontWeight:z.ativa?700:600,letterSpacing:0.5,paddingTop:1}},z.tag+" "+z.nome),
              h("span",{style:{fontSize:9,color:z.ativa?"#C0B8A8":"#8A8070",lineHeight:1.45,flex:1,fontStyle:z.ativa?"normal":"italic"}},z.desc)
            ))
          )
        ),
        // === ESTRATEGIA DE EVOLUCAO DO INDICE ===
        (()=>{
          // Calcula razao E/R de cada classe e classifica
          // Tambem considera bandas-alvo e composicao atual
          const analise=[];
          CL.forEach(c=>{
            const p=RR[c.id];if(!p||p.r<=0)return;
            const razaoClasse=p.e/p.r;
            const pesoAtual=cw[c.id]||0;
            const dentroBanda=pesoAtual>=c.min&&pesoAtual<=c.max;
            const abaixoBanda=pesoAtual<c.min;
            const acimaBanda=pesoAtual>c.max;
            // "Espaco" disponivel para aumentar/reduzir respeitando banda
            const espacoSubir=Math.max(0,c.max-pesoAtual);
            const espacoDescer=Math.max(0,pesoAtual-c.min);
            analise.push({
              tag:c.tag,nome:c.name,cor:c.color,id:c.id,
              razao:razaoClasse,peso:pesoAtual,min:c.min,max:c.max,
              dentroBanda,abaixoBanda,acimaBanda,espacoSubir,espacoDescer,
              // Comparativo com o ratio global do portfolio
              alavancadora:razaoClasse>ratio,lastradora:razaoClasse<ratio
            });
          });
          // Alavancadoras: razao > ratio atual, com espaco pra subir e ainda dentro/abaixo da banda
          const alavancadoras=analise
            .filter(a=>a.alavancadora&&a.espacoSubir>0.5)
            .sort((a,b)=>b.razao-a.razao);
          // Lastradoras: razao < ratio, e estao acima da banda ou perto do max
          const lastradoras=analise
            .filter(a=>a.lastradora&&a.peso>=a.min)
            .sort((a,b)=>a.razao-b.razao);
          // Calcula meta: se ratio<1.8, mostrar como subir; se >=1.8, mostrar como manter
          const metaExcel=ratio<1.8;
          const gap=1.8-ratio;
          // Simula um aporte tipico (5% do patrimonio em alavancadoras + reducao 1pp em lastradoras)
          // para mostrar impacto estimado no ratio
          let novoR=portR,novoE=portE,novoRatio=ratio;
          if(alavancadoras.length>0){
            const top=alavancadoras[0];
            // Simula adicionar 2pp em cima (limite da banda) - calcula novo ratio
            const aumento=Math.min(2,top.espacoSubir);
            // Novo total nao muda (assumindo redistribuicao interna)
            // Simulamos: tira 'aumento' pp de proporcionalmente das lastradoras
            let totLastr=lastradoras.reduce((s,l)=>s+l.peso,0);
            if(totLastr>0&&aumento>0){
              const dWR=aumento*(RR[top.id].r-(lastradoras.reduce((s,l)=>s+l.peso*RR[l.id].r,0)/totLastr));
              const dWE=aumento*(RR[top.id].e-(lastradoras.reduce((s,l)=>s+l.peso*RR[l.id].e,0)/totLastr));
              novoR=portR+dWR/100;
              novoE=portE+dWE/100;
              novoRatio=novoR>0?novoE/novoR:ratio;
            }
          }
          const deltaRatio=novoRatio-ratio;
          // Constroi texto da estrategia
          const linhasEstr=[];
          if(metaExcel){
            // Como subir o indice
            linhasEstr.push({label:"Meta",valor:"Levar indice de "+ratio.toFixed(2)+" para >= 1.80 (zona EXCEL). Distancia: "+gap.toFixed(2)+" pontos."});
          }else{
            linhasEstr.push({label:"Meta",valor:"Manter indice acima de 1.80 (zona EXCEL atual: "+ratio.toFixed(2)+"). Foco em preservar a eficiencia."});
          }
          // Direcionamento de aportes
          if(alavancadoras.length>0){
            const top3=alavancadoras.slice(0,3);
            const lista=top3.map(a=>a.tag+" ("+a.razao.toFixed(2)+(a.abaixoBanda?", "+(a.min-a.peso).toFixed(1)+"pp abaixo do minimo":a.dentroBanda?", "+a.espacoSubir.toFixed(1)+"pp ate o maximo":"")+")").join("; ");
            linhasEstr.push({label:"Priorizar",valor:"Direcione proximos aportes para classes com razao E/R alta: "+lista+"."});
          }
          // Lastradoras (informativo, sem vender)
          if(lastradoras.length>0){
            const piores=lastradoras.slice(0,2).map(l=>l.tag+" ("+l.razao.toFixed(2)+")").join(" e ");
            linhasEstr.push({label:"Desacelerar",valor:"Reduza aportes (zero vendas) em "+piores+" - razao E/R abaixo da media do portfolio. Deixe o tempo e os aportes nas outras classes reequilibrarem."});
          }
          // Simulacao
          if(deltaRatio>0.005){
            const corImpacto=novoRatio>=1.8?"#4CAF82":novoRatio>=1.5?"#7AC494":"#E8C44A";
            linhasEstr.push({label:"Simulacao",valor:"Mover 2pp do peso para "+alavancadoras[0].tag+" eleva o indice para ~"+novoRatio.toFixed(2)+" (+"+(deltaRatio*100).toFixed(0)+" centavos). "+(novoRatio>=1.8?"Atingiria zona EXCEL.":novoRatio>=1.5?"Mantem zona OTIMA, aproximando do limite.":"Movimento na direcao certa.")});
          }
          // Disciplina geral
          if(metaExcel){
            linhasEstr.push({label:"Disciplina",valor:"Buy & Hold: nao vender, apenas redirecionar aportes mensais nas classes alavancadoras dentro de suas bandas-alvo. Quality at a reasonable price - nao sacrificar qualidade dos ativos pela razao matematica."});
          }else{
            linhasEstr.push({label:"Disciplina",valor:"Indice ja em zona EXCEL. Continue alocando dentro das bandas-alvo. Eficiencia preservada quando aportes respeitam as bandas; quedas naturais ocorrem se classes de menor razao crescerem desproporcionalmente."});
          }
          return h("div",{style:{marginTop:11,paddingTop:10,borderTop:"1px solid rgba(255,215,0,0.12)"}},
            h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7,gap:8,flexWrap:"wrap"}},
              h("div",{style:{fontSize:8,color:"#FFD700",fontFamily:"monospace",letterSpacing:2,fontWeight:700}},metaExcel?"\u2197 ESTRATEGIA: ELEVAR INDICE PARA EXCEL":"\u2713 ESTRATEGIA: MANTER INDICE EM EXCEL"),
              metaExcel&&h("div",{style:{fontSize:9,color:"#E8C44A",fontFamily:"monospace",fontWeight:700}},ratio.toFixed(2)+" \u2192 1.80")
            ),
            ...linhasEstr.map((l,i)=>h("div",{key:i,style:{display:"flex",gap:7,marginBottom:i===linhasEstr.length-1?0:5,fontSize:10,lineHeight:1.5}},
              h("span",{style:{minWidth:80,color:"#A89070",fontFamily:"monospace",fontSize:8,letterSpacing:1,paddingTop:2}},l.label.toUpperCase()),
              h("span",{style:{color:"#C0B8A8",flex:1}},l.valor)
            ))
          );
        })()
      );
    })()
  );
}

function EvolChart({histMensal,hist,showUSD,setShowUSD,hideVal}){
  // Prioridade: histMensal (consolidado). Fallback para hist agrupado (compatibilidade).
  let data=[];
  if(Array.isArray(histMensal)&&histMensal.length>0){
    data=histMensal.filter(r=>r.composicao&&r.totalPatrimBRL>0);
  }else if(Array.isArray(hist)&&hist.length>0){
    // Fallback: agrupa hist por mes
    const raw=hist.filter(r=>r.composicao&&r.totalPatrimBRL>0).slice().reverse();
    const porMes={};
    raw.forEach(r=>{
      const d=new Date(r.date);
      const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      porMes[k]=r;
    });
    const chaves=Object.keys(porMes).sort();
    data=chaves.map(k=>porMes[k]);
  }

  const empty=h("div",{style:{padding:"14px",textAlign:"center",color:"#5A5550",fontSize:11,fontStyle:"italic",border:"1px solid rgba(255,255,255,0.05)",borderRadius:8}},"Disponivel apos 1 mes ou mais de historico");
  const toggler=h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
    h("button",{onClick:()=>setShowUSD(false),style:{fontSize:9,padding:"3px 10px",borderRadius:4,fontFamily:"monospace",background:!showUSD?"#C8A96E":"transparent",border:"1px solid rgba(200,169,110,0.4)",color:!showUSD?"#0D0F14":"#8A8070",cursor:"pointer"}},"BRL"),
    h("button",{onClick:()=>setShowUSD(true),style:{fontSize:9,padding:"3px 10px",borderRadius:4,fontFamily:"monospace",background:showUSD?"#5B8FD4":"transparent",border:"1px solid rgba(91,143,212,0.4)",color:showUSD?"#0D0F14":"#8A8070",cursor:"pointer"}},"USD")
  );
  if(data.length<1)return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:8}},"Evolucao por classe"),
    toggler,empty
  );
  // Calcula valor R$ (ou USD) de cada classe em cada mes
  const serie={};
  CL.forEach(c=>{serie[c.id]=data.map(r=>{
    const totalBRL=r.totalPatrimBRL||0;
    const pct=(r.composicao[c.id]||0)/100;
    const valBRL=totalBRL*pct;
    return showUSD?valBRL/(FX.USD||5):valBRL;
  });});
  // Range Y
  const allVals=Object.values(serie).flat().filter(v=>v>0);
  const minV=allVals.length?Math.min(...allVals)*0.9:0;
  const maxV=allVals.length?Math.max(...allVals)*1.05:1;
  const rng=maxV-minV||1;
  // LARGURA ADAPTATIVA: 12 meses cabem na tela; cada mes extra estica o SVG
  const MESES_VISIVEIS=12;
  const W_BASE=320,pL=46,pB=24,pT=10,pR=14;
  const cW_BASE=W_BASE-pL-pR; // largura util quando ha <=12 meses
  // Largura por mes quando supera 12 (mantem mesma densidade visual)
  const larguraPorMes=cW_BASE/Math.max(1,MESES_VISIVEIS-1);
  const W=data.length<=MESES_VISIVEIS?W_BASE:pL+pR+(data.length-1)*larguraPorMes;
  const H=200,cW=W-pL-pR,cH=H-pB-pT;
  const xScale=i=>data.length===1?pL+cW/2:pL+(i/(data.length-1))*cW;
  const yScale=v=>pT+cH-((v-minV)/rng)*cH;
  const fmtY=(v)=>{
    if(hideVal)return "----";
    if(v>=1000000)return (showUSD?"$":"R$")+(v/1000000).toFixed(1)+"M";
    if(v>=1000)return (showUSD?"$":"R$")+(v/1000).toFixed(0)+"k";
    return (showUSD?"$":"R$")+v.toFixed(0);
  };
  const fmtMes=(r)=>{
    const meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    const d=new Date(r.date);
    return meses[d.getMonth()]+"/"+String(d.getFullYear()).slice(2);
  };
  // Quantos labels exibir
  const maxLabels=Math.min(12,data.length);
  const step=Math.max(1,Math.ceil(data.length/maxLabels));
  const idxLabels=[];
  for(let i=0;i<data.length;i+=step)idxLabels.push(i);
  if(idxLabels[idxLabels.length-1]!==data.length-1)idxLabels.push(data.length-1);
  const precisaRolar=data.length>MESES_VISIVEIS;

  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
      h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase"}},"Evolucao por classe"),
      h("div",{style:{fontSize:8,color:"#5A5550",fontFamily:"monospace"}},data.length+" "+(data.length===1?"mes":"meses")+(precisaRolar?" - role lateral":""))
    ),
    toggler,
    // Container com overflow horizontal quando passar de 12 meses
    h("div",{style:{overflowX:precisaRolar?"auto":"visible",overflowY:"hidden",WebkitOverflowScrolling:"touch"}},
      h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:precisaRolar?(W*(W_BASE/W_BASE))+"px":"100%",minWidth:precisaRolar?W+"px":"auto",height:"auto",display:"block"}},
      // Linhas guia horizontais
      ...[0,0.25,0.5,0.75,1].map(f=>{
        const y=pT+cH-(f*cH),v=minV+f*rng;
        return h(Fragment,{key:"g"+f},
          h("line",{x1:pL,y1:y,x2:W-pR,y2:y,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}),
          h("text",{x:pL-3,y:y+3,textAnchor:"end",fill:"#5A5550",fontSize:"7",fontFamily:"monospace"},fmtY(v))
        );
      }),
      // Linhas verticais sutis nos meses com label
      ...idxLabels.map(i=>h("line",{key:"v"+i,x1:xScale(i),y1:pT,x2:xScale(i),y2:pT+cH,stroke:"rgba(255,255,255,0.03)",strokeWidth:"1"})),
      // Linhas + pontos por classe
      ...CL.map(c=>{
        const vals=serie[c.id];
        const pts=vals.map((v,i)=>({x:xScale(i),y:yScale(v),v}));
        const lineD=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
        return h(Fragment,{key:c.id},
          data.length>=2&&h("path",{d:lineD,fill:"none",stroke:c.color,strokeWidth:"1.2",strokeLinejoin:"round",strokeLinecap:"round",opacity:"0.55"}),
          ...pts.map((p,i)=>h("circle",{key:"p"+c.id+i,cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:i===pts.length-1?"3":"2.4",fill:c.color,stroke:"#0D0F14",strokeWidth:"1",opacity:i===pts.length-1?"1":"0.85"}))
        );
      }),
      // Labels mes/ano no eixo X
      ...idxLabels.map((i)=>{
        const r=data[i];if(!r)return null;
        const x=xScale(i);
        return h("text",{key:"l"+i,x:x.toFixed(1),y:H-pB+12,textAnchor:"middle",fill:"#7A7060",fontSize:"7",fontFamily:"monospace"},fmtMes(r));
      })
      )
    ),
    // Legenda
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:4,marginTop:10}},
      ...CL.map(c=>{
        const ult=serie[c.id][serie[c.id].length-1];
        return h("div",{key:c.id,style:{display:"flex",alignItems:"center",gap:6,padding:"3px 6px",background:"rgba(0,0,0,0.15)",borderRadius:4,borderLeft:"3px solid "+c.color}},
          h("span",{style:{fontSize:8,color:c.color,fontFamily:"monospace",fontWeight:"bold",minWidth:22}},c.tag),
          h("span",{style:{fontSize:9,color:"#8A8070",fontFamily:"monospace",flex:1,textAlign:"right"}},fmtY(ult))
        );
      })
    )
  );
}

// Heatmap mensal: variacao % do patrimonio mes a mes
// Componente que mostra rentabilidade do portfolio vs indices comparativos
// histMensal: array dos snapshots do portfolio por mes
// idxMensal: objeto {"YYYY-MM": {ibov, ifix, cdi, imab, sp500, nasdaq, poupanca}}
function ComparativoChart({histMensal,idxMensal,hideVal}){
  // Calcula rentabilidade do portfolio por mes: (Vfinal - Aporte) / Vinicial - 1
  // Precisa de pelo menos 2 snapshots mensais para ter 1 retorno
  if(!Array.isArray(histMensal)||histMensal.length<1)return null;
  // Ordena por data crescente
  const snaps=histMensal.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  // Calcula retornos mensais do portfolio
  const retPortfolio={};// {"YYYY-MM": retorno%}
  for(let i=1;i<snaps.length;i++){
    const ant=snaps[i-1],atu=snaps[i];
    if(!ant.totalPatrimBRL||!atu.totalPatrimBRL)continue;
    const aporte=atu.apValue||0;
    const ret=((atu.totalPatrimBRL-aporte)/ant.totalPatrimBRL-1)*100;
    if(!isNaN(ret)){
      const d=new Date(atu.date);
      const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      retPortfolio[k]=ret;
    }
  }
  // Coleta todos os meses que tem dados (portfolio OU indices)
  const todosM=new Set([...Object.keys(retPortfolio),...Object.keys(idxMensal||{})]);
  const meses=Array.from(todosM).sort();
  if(meses.length===0)return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:8}},"Rentabilidade comparativa"),
    h("div",{style:{padding:"14px",textAlign:"center",color:"#5A5550",fontSize:11,fontStyle:"italic",border:"1px solid rgba(255,255,255,0.05)",borderRadius:8}},"Aguardando dados. Sera populado nos proximos meses.")
  );
  // Mostra apenas os ultimos 12 meses na tabela (scroll vertical se mais)
  const mesesExibidos=meses.slice(-12);
  // Calcula acumulado de cada indice
  const calcAcumulado=(serie,mesesArr)=>{
    let acum=1;
    mesesArr.forEach(k=>{const v=serie[k];if(typeof v==="number"&&!isNaN(v))acum*=(1+v/100);});
    return (acum-1)*100;
  };
  // Constrói séries por indice
  const cols=[
    {key:"port",nome:"Portfolio",cor:"#C8A96E",get:(k)=>retPortfolio[k]},
    {key:"ibov",nome:"IBOV",cor:"#4CAF82",get:(k)=>(idxMensal[k]||{}).ibov},
    {key:"ifix",nome:"IFIX",cor:"#5B8FD4",get:(k)=>(idxMensal[k]||{}).ifix},
    {key:"imab",nome:"IMA-B",cor:"#A56FD4",get:(k)=>(idxMensal[k]||{}).imab},
    {key:"cdi",nome:"CDI",cor:"#E8C44A",get:(k)=>(idxMensal[k]||{}).cdi},
    {key:"sp500",nome:"S&P 500",cor:"#7AC494",get:(k)=>(idxMensal[k]||{}).sp500},
    {key:"nasdaq",nome:"NASDAQ",cor:"#E89060",get:(k)=>(idxMensal[k]||{}).nasdaq},
    {key:"poup",nome:"Poup.",cor:"#7A7570",get:(k)=>(idxMensal[k]||{}).poupanca}
  ];
  // Acumulado de cada
  const acums={};
  cols.forEach(c=>{
    const serieCol={};
    meses.forEach(k=>{const v=c.get(k);if(typeof v==="number"&&!isNaN(v))serieCol[k]=v;});
    acums[c.key]=calcAcumulado(serieCol,meses);
  });
  // Volatilidade e Sharpe (precisa de >=6 meses)
  const calcVolSharpe=(c)=>{
    const valores=meses.map(k=>c.get(k)).filter(v=>typeof v==="number"&&!isNaN(v));
    if(valores.length<6)return {vol:null,sharpe:null};
    const m=valores.reduce((s,v)=>s+v,0)/valores.length;
    const var2=valores.reduce((s,v)=>s+Math.pow(v-m,2),0)/valores.length;
    const sd=Math.sqrt(var2);
    const volAnual=sd*Math.sqrt(12);
    // Sharpe = (retornoMedio - CDI_medio) / volatilidade (anualizado)
    const cdiVals=meses.map(k=>(idxMensal[k]||{}).cdi).filter(v=>typeof v==="number"&&!isNaN(v));
    const cdiMedio=cdiVals.length>0?cdiVals.reduce((s,v)=>s+v,0)/cdiVals.length:0;
    const sharpe=sd>0?((m-cdiMedio)*12)/volAnual:null;
    return {vol:volAnual,sharpe};
  };
  const metricas={};
  cols.forEach(c=>{metricas[c.key]=calcVolSharpe(c);});
  // Formatador de cor por valor
  const corCelula=(v)=>{
    if(typeof v!=="number"||isNaN(v))return "#5A5550";
    if(v>=2)return "#4CAF82";
    if(v>=0)return "#7AC494";
    if(v>=-2)return "#E89060";
    return "#E05252";
  };
  const fmtPct=(v)=>{
    if(typeof v!=="number"||isNaN(v))return "-";
    return (v>=0?"+":"")+v.toFixed(2)+"%";
  };
  const fmtMes=(k)=>{
    const [a,m]=k.split("-");
    const meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    return meses[parseInt(m)-1]+"/"+a.slice(2);
  };
  // === SVG: gráfico de retorno acumulado ===
  const construirAcumulado=(c)=>{
    // serie de acumulado mes a mes
    let acum=1;
    const arr=[];
    meses.forEach(k=>{
      const v=c.get(k);
      if(typeof v==="number"&&!isNaN(v))acum*=(1+v/100);
      arr.push((acum-1)*100);
    });
    return arr;
  };
  const seriesAcum={};
  cols.forEach(c=>{seriesAcum[c.key]=construirAcumulado(c);});
  const todosVals=Object.values(seriesAcum).flat().filter(v=>!isNaN(v));
  const yMin=todosVals.length?Math.min(...todosVals,0):0;
  const yMax=todosVals.length?Math.max(...todosVals,0):1;
  const yRng=(yMax-yMin)||1;
  const W=340,H=180,pL=36,pR=10,pT=10,pB=22,cW=W-pL-pR,cH=H-pB-pT;
  const xScale=i=>meses.length<=1?pL+cW/2:pL+(i/(meses.length-1))*cW;
  const yScale=v=>pT+cH-((v-yMin)/yRng)*cH;
  // Eixo X com max 6 labels
  const stepLabels=Math.max(1,Math.ceil(meses.length/6));
  const idxLabels=[];for(let i=0;i<meses.length;i+=stepLabels)idxLabels.push(i);
  if(idxLabels[idxLabels.length-1]!==meses.length-1)idxLabels.push(meses.length-1);

  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Rentabilidade comparativa"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Retorno time-weighted descontando aportes vs indices de mercado"),
    // Grafico de acumulado
    h("div",{style:{marginBottom:14,padding:"10px",background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:8}},
      h("div",{style:{fontSize:9,color:"#8A8070",marginBottom:6,fontFamily:"monospace",letterSpacing:1}},"RETORNO ACUMULADO (%) "+(meses.length>1?meses[0]+" \u2192 "+meses[meses.length-1]:meses[0])),
      h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto",display:"block"}},
        // grade
        ...[0,0.25,0.5,0.75,1].map(f=>{
          const y=pT+cH-f*cH,v=yMin+f*yRng;
          return h(Fragment,{key:"g"+f},
            h("line",{x1:pL,y1:y,x2:W-pR,y2:y,stroke:"rgba(255,255,255,0.04)",strokeWidth:"1"}),
            h("text",{x:pL-3,y:y+3,textAnchor:"end",fill:"#5A5550",fontSize:"7",fontFamily:"monospace"},(v>=0?"+":"")+v.toFixed(0)+"%")
          );
        }),
        // linha zero
        Math.abs(yMin)>0.01&&h("line",{x1:pL,y1:yScale(0),x2:W-pR,y2:yScale(0),stroke:"rgba(255,255,255,0.15)",strokeWidth:"1",strokeDasharray:"3,2"}),
        // Linhas das series
        ...cols.map(c=>{
          const pts=seriesAcum[c.key].map((v,i)=>({x:xScale(i),y:yScale(v)}));
          if(pts.length===0)return null;
          const d=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
          const isPort=c.key==="port";
          return h(Fragment,{key:c.key},
            h("path",{d,fill:"none",stroke:c.cor,strokeWidth:isPort?"2.2":"1.1",opacity:isPort?"1":"0.55",strokeLinejoin:"round",strokeLinecap:"round"}),
            // ponto final destacado so para portfolio
            isPort&&pts.length>0&&h("circle",{cx:pts[pts.length-1].x.toFixed(1),cy:pts[pts.length-1].y.toFixed(1),r:"3",fill:c.cor,stroke:"#0D0F14",strokeWidth:"1.5"})
          );
        }),
        // Labels eixo X
        ...idxLabels.map(i=>{
          const x=xScale(i);
          return h("text",{key:"l"+i,x:x.toFixed(1),y:H-pB+12,textAnchor:"middle",fill:"#7A7060",fontSize:"7",fontFamily:"monospace"},fmtMes(meses[i]));
        })
      ),
      // Legenda compacta
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px 12px",marginTop:8,fontSize:8,fontFamily:"monospace"}},
        ...cols.map(c=>h("div",{key:c.key,style:{display:"flex",alignItems:"center",gap:4}},
          h("span",{style:{width:8,height:c.key==="port"?3:2,background:c.cor,borderRadius:1}}),
          h("span",{style:{color:c.key==="port"?"#F0EAD8":"#8A8070",fontWeight:c.key==="port"?700:400}},c.nome)
        ))
      )
    ),
    // Tabela de retornos mensais
    h("div",{style:{overflowX:"auto",WebkitOverflowScrolling:"touch",marginBottom:14}},
      h("table",{style:{borderCollapse:"collapse",fontFamily:"monospace",fontSize:9,width:"100%",minWidth:Math.max(420,cols.length*60)}},
        h("thead",{},
          h("tr",{},
            h("th",{style:{padding:"6px 6px",textAlign:"left",color:"#8A8070",borderBottom:"1px solid rgba(255,255,255,0.08)",fontSize:8,letterSpacing:1}},"MES"),
            ...cols.map(c=>h("th",{key:c.key,style:{padding:"6px 6px",textAlign:"right",color:c.cor,borderBottom:"1px solid rgba(255,255,255,0.08)",fontSize:8,letterSpacing:1,fontWeight:c.key==="port"?700:600}},c.nome))
          )
        ),
        h("tbody",{},
          ...mesesExibidos.map(k=>h("tr",{key:k,style:{borderBottom:"1px solid rgba(255,255,255,0.03)"}},
            h("td",{style:{padding:"5px 6px",color:"#9A9080",fontSize:9}},fmtMes(k)),
            ...cols.map(c=>{
              const v=c.get(k);
              const isPort=c.key==="port";
              return h("td",{key:c.key,style:{padding:"5px 6px",textAlign:"right",color:corCelula(v),fontWeight:isPort?700:500,background:isPort?"rgba(200,169,110,0.04)":"transparent"}},fmtPct(v));
            })
          )),
          // Linha de acumulado
          h("tr",{style:{borderTop:"2px solid rgba(200,169,110,0.25)",background:"rgba(200,169,110,0.04)"}},
            h("td",{style:{padding:"7px 6px",color:"#C8A96E",fontSize:9,fontWeight:700,letterSpacing:1}},"ACUM"),
            ...cols.map(c=>h("td",{key:c.key,style:{padding:"7px 6px",textAlign:"right",color:corCelula(acums[c.key]),fontWeight:700}},fmtPct(acums[c.key])))
          )
        )
      )
    ),
    // Métricas de risco (apenas se >=6 meses)
    meses.length>=6&&h("div",{style:{padding:"10px 12px",background:"rgba(91,143,212,0.04)",border:"1px solid rgba(91,143,212,0.15)",borderRadius:8}},
      h("div",{style:{fontSize:9,color:"#5B8FD4",fontFamily:"monospace",letterSpacing:1,marginBottom:7}},"METRICAS DE RISCO (ANUALIZADAS)"),
      h("div",{style:{overflowX:"auto",WebkitOverflowScrolling:"touch"}},
        h("table",{style:{borderCollapse:"collapse",fontFamily:"monospace",fontSize:9,width:"100%",minWidth:380}},
          h("thead",{},
            h("tr",{},
              h("th",{style:{padding:"4px 6px",textAlign:"left",color:"#7A7570",fontSize:8}},""),
              ...cols.map(c=>h("th",{key:c.key,style:{padding:"4px 6px",textAlign:"right",color:c.cor,fontSize:8,fontWeight:600}},c.nome))
            )
          ),
          h("tbody",{},
            h("tr",{},
              h("td",{style:{padding:"4px 6px",color:"#8A8070"}},"Volatilidade"),
              ...cols.map(c=>h("td",{key:c.key,style:{padding:"4px 6px",textAlign:"right",color:"#B0A890"}},metricas[c.key].vol!==null?metricas[c.key].vol.toFixed(1)+"%":"-"))
            ),
            h("tr",{},
              h("td",{style:{padding:"4px 6px",color:"#8A8070"}},"Sharpe"),
              ...cols.map(c=>h("td",{key:c.key,style:{padding:"4px 6px",textAlign:"right",color:metricas[c.key].sharpe>0?"#4CAF82":metricas[c.key].sharpe<0?"#E05252":"#B0A890"}},metricas[c.key].sharpe!==null?metricas[c.key].sharpe.toFixed(2):"-"))
            )
          )
        )
      ),
      h("div",{style:{fontSize:8,color:"#5A5550",marginTop:6,fontStyle:"italic"}},"Vol = desvio-padrao mensal anualizado. Sharpe = (retorno - CDI) / vol. Calculado sobre "+meses.length+" meses.")
    ),
    meses.length<6&&meses.length>=1&&h("div",{style:{padding:"8px 12px",background:"rgba(232,196,74,0.04)",border:"1px solid rgba(232,196,74,0.15)",borderRadius:6,fontSize:9,color:"#A89070",fontStyle:"italic"}},"Volatilidade e Sharpe disponiveis a partir de 6 meses de historico ("+meses.length+"/6)")
  );
}

function HeatmapChart({hist}){
  const data=hist.filter(r=>r.totalPatrimBRL>0).slice().reverse();
  if(data.length<2)return null;
  // Agrupa por mes (YYYY-MM), pega ultimo valor de cada mes
  const byMonth={};
  data.forEach(r=>{
    const d=new Date(r.date),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    byMonth[k]={v:r.totalPatrimBRL,ap:r.totalExecuted||r.apValue||0,date:d};
  });
  const keys=Object.keys(byMonth).sort();
  if(keys.length<2)return null;
  // Calcular variacao mes a mes descontando aportes (rentabilidade mensal aproximada)
  const variacoes=[];
  for(let i=1;i<keys.length;i++){
    const prev=byMonth[keys[i-1]],cur=byMonth[keys[i]];
    const aporteMes=cur.ap;
    // (valor_atual - aporte_do_mes - valor_anterior) / valor_anterior
    const varPct=prev.v>0?((cur.v-aporteMes-prev.v)/prev.v)*100:0;
    variacoes.push({mes:keys[i],date:cur.date,pct:varPct});
  }
  if(!variacoes.length)return null;
  // Agrupa por ano para grade
  const byYear={};
  variacoes.forEach(v=>{
    const y=v.date.getFullYear();
    if(!byYear[y])byYear[y]=Array(12).fill(null);
    byYear[y][v.date.getMonth()]=v.pct;
  });
  const years=Object.keys(byYear).sort();
  const meses=["J","F","M","A","M","J","J","A","S","O","N","D"];
  const colorFor=p=>{
    if(p===null)return"rgba(255,255,255,0.03)";
    if(p>=3)return"#1E7A4A";
    if(p>=1)return"#3D9F6A";
    if(p>=0)return"#5DBF82";
    if(p>=-1)return"#D99A55";
    if(p>=-3)return"#C46045";
    return"#A03030";
  };
  return h("div",{style:{marginBottom:20,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.05)"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Heatmap Mensal"),
    h("div",{style:{fontSize:9,color:"#5A5550",marginBottom:10,fontStyle:"italic"}},"Rentabilidade mensal descontando aportes"),
    ...years.map(y=>h("div",{key:y,style:{display:"flex",alignItems:"center",gap:4,marginBottom:5}},
      h("span",{style:{fontSize:9,color:"#8A8070",fontFamily:"monospace",width:34,flexShrink:0}},y),
      ...byYear[y].map((p,i)=>h("div",{key:i,title:meses[i]+" "+y+": "+(p===null?"sem dados":(p>=0?"+":"")+p.toFixed(2)+"%"),style:{flex:1,aspectRatio:"1",background:colorFor(p),borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,color:p===null?"#3A3830":(Math.abs(p)>1?"#0D0F14":"#FFFFFF"),fontFamily:"monospace",fontWeight:"bold",minHeight:22}},p===null?meses[i]:(p>=0?"+":"")+p.toFixed(1))
    ))),
    // Legenda
    h("div",{style:{display:"flex",alignItems:"center",gap:5,marginTop:8,justifyContent:"center"}},
      h("span",{style:{fontSize:8,color:"#7A7570",fontFamily:"monospace"}},"-3%"),
      ...[-3,-1,0,1,3].map(p=>h("div",{key:p,style:{width:18,height:10,background:colorFor(p),borderRadius:2}})),
      h("span",{style:{fontSize:8,color:"#7A7570",fontFamily:"monospace"}},"+3%")
    )
  );
}

// Evolucao por classe: mini-graficos de linha mostrando % real vs banda alvo
function BandHeatmap({hist,cw}){
  const data=hist.filter(r=>r.composicao).slice().reverse();
  const nowSnap={date:new Date().toISOString(),composicao:{}};
  CL.forEach(c=>{nowSnap.composicao[c.id]=cw[c.id]||0;});
  const allSnaps=[...data,nowSnap];
  if(allSnaps.length<2)return h("div",{style:{marginBottom:14,padding:"11px 13px",background:"rgba(255,255,255,0.02)",border:"1px dashed rgba(255,255,255,0.08)",borderRadius:8,textAlign:"center"}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#7A7570",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Evolucao vs Banda"),
    h("div",{style:{fontSize:10,color:"#5A5550",fontStyle:"italic"}},"Disponivel apos 1+ aporte registrado ou atualizacao de precos")
  );
  // Limita aos ultimos 50 snapshots (mostra ate ~ultimas 12h de oscilacao se atualizar com freq)
  const snaps=allSnaps.slice(-50);
  // Mini-grafico SVG por classe
  const W=300,H=44,pL=8,pR=42,pT=4,pB=4,cW=W-pL-pR,cH=H-pT-pB;
  return h("div",{style:{marginBottom:14,padding:"11px 13px",background:"rgba(76,175,130,0.03)",border:"1px solid rgba(76,175,130,0.2)",borderRadius:8}},
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#4CAF82",fontFamily:"monospace",textTransform:"uppercase",marginBottom:4}},"Evolucao vs Banda Alvo"),
    h("div",{style:{fontSize:9,color:"#7A9A7A",marginBottom:10,fontStyle:"italic"}},"Linha colorida = % atual da classe. Faixa sombreada = banda alvo."),
    ...CL.filter(c=>c.id!=="imoveis").map(c=>{
      const vals=snaps.map(s=>s.composicao[c.id]||0);
      const curPct=vals[vals.length-1]||0;
      const inBand=curPct>=c.min&&curPct<=c.max;
      const status=curPct<c.min?"abaixo":curPct>c.max&&!c.flex?"acima":"ok";
      // Escala Y: do 0 ate o maior valor entre c.max+5 e max dos vals
      const yMax=Math.max(c.max+4,...vals,c.max*1.3);
      const yMin=0;
      const yScale=v=>pT+cH-((v-yMin)/(yMax-yMin))*cH;
      const xScale=i=>pL+(i/(snaps.length-1||1))*cW;
      // Linha do portfolio
      const lineD=vals.map((v,i)=>(i===0?"M":"L")+xScale(i).toFixed(1)+" "+yScale(v).toFixed(1)).join(" ");
      // Faixa da banda alvo (retangulo sombreado)
      const yMaxBand=yScale(c.max),yMinBand=yScale(c.min);
      // Status color
      const sc=status==="abaixo"?"#E05252":status==="acima"?"#E8C44A":"#4CAF82";
      // Indicador de tendencia
      const tendencia=vals.length>=2?vals[vals.length-1]-vals[0]:0;
      const seta=Math.abs(tendencia)<0.2?"":tendencia>0?"^":"v";
      return h("div",{key:c.id,style:{display:"flex",alignItems:"center",gap:6,marginBottom:6,padding:"5px 6px",background:"rgba(0,0,0,0.18)",borderRadius:5,borderLeft:"3px solid "+c.color}},
        h("div",{style:{width:34,flexShrink:0}},
          h("div",{style:{fontSize:10,color:c.color,fontFamily:"monospace",fontWeight:"bold"}},c.tag),
          h("div",{style:{fontSize:7,color:"#5A5550",fontFamily:"monospace"}},c.min+"-"+c.max+"%")
        ),
        h("div",{style:{flex:1,position:"relative"}},
          h("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"none",style:{width:"100%",height:H,display:"block"}},
            // Faixa da banda alvo (sombreada)
            h("rect",{x:pL,y:yMaxBand.toFixed(1),width:cW,height:(yMinBand-yMaxBand).toFixed(1),fill:c.color,fillOpacity:"0.18"}),
            // Linhas guia min e max
            h("line",{x1:pL,y1:yMaxBand.toFixed(1),x2:pL+cW,y2:yMaxBand.toFixed(1),stroke:c.color,strokeWidth:"0.7",strokeOpacity:"0.6",strokeDasharray:"3,2"}),
            h("line",{x1:pL,y1:yMinBand.toFixed(1),x2:pL+cW,y2:yMinBand.toFixed(1),stroke:c.color,strokeWidth:"0.7",strokeOpacity:"0.6",strokeDasharray:"3,2"}),
            // Linha do portfolio
            h("path",{d:lineD,fill:"none",stroke:sc,strokeWidth:"1.8",strokeLinejoin:"round",strokeLinecap:"round"}),
            // Pontos
            ...vals.map((v,i)=>h("circle",{key:i,cx:xScale(i).toFixed(1),cy:yScale(v).toFixed(1),r:i===vals.length-1?"2.6":"1.4",fill:sc,stroke:"#0D0F14",strokeWidth:i===vals.length-1?"1":"0"})),
            // Valor atual no canto direito
            h("text",{x:W-pR+4,y:yScale(curPct).toFixed(1),fill:sc,fontSize:"9",fontFamily:"monospace",fontWeight:"bold",dominantBaseline:"middle"},curPct.toFixed(1)+"%")
          )
        ),
        h("div",{style:{width:14,flexShrink:0,textAlign:"center",fontSize:11,color:tendencia>0?"#4CAF82":tendencia<0?"#E05252":"#5A5550",fontFamily:"monospace",fontWeight:"bold"}},seta)
      );
    })
  );
}

function App(){
  const [apiKey,setApiKeyS]=useState("");
  const [brapiKey,setBrapiKeyS]=useState("");

      const ano=hoje.getFullYear()+Math.floor((hoje.getMonth()+i)/12);

      if(!mesesSel.includes(mes+1))continue;

      const fim=new Date(inicio);fim.setDate(fim.getDate()+faixa);
      if(hoje<=fim){
        const diasAteInicio=Math.ceil((inicio-hoje)/(24*3600*1000));

        modo==="esqueci"?h("div",{},
          h("textarea",{id:"recovery-key",placeholder:"sk-ant-api03-...",rows:3,style:{width:"100%",background:"rgba(0,0,0,0.4)",border:"1px solid rgba(200,169,110,0.3)",borderRadius:8,padding:"10px 12px",color:"#F0EAD8",fontSize:12,fontFamily:"monospace",outline:"none",boxSizing:"border-box",resize:"none",marginBottom:10}}),
          h("div",{style:{fontSize:10,color:"#E8C44A",marginBottom:10,fontStyle:"italic"}},"Atencao: resetar o PIN apaga todos os dados criptografados. Tenha backup JSON pronto."),
          h("button",{onClick:validarApiKeyEResetar,style:{width:"100%",padding:"12px",background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,color:"#0D0F14",fontSize:12,fontWeight:700,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",marginBottom:8}},"Validar e resetar PIN"),
          h("button",{onClick:()=>{setPinMode("entrada");setPinErr("");},style:{background:"none",border:"none",color:"#8A8070",fontSize:11,cursor:"pointer",textDecoration:"underline"}},"voltar")
        ):h("div",{},
          h("div",{style:{display:"flex",justifyContent:"center",gap:tamEsperado>4?10:14,marginBottom:34}},
            ...indicadores.map(i=>h("div",{key:i,style:{width:14,height:14,borderRadius:"50%",background:i<pinInput.length?"#C8A96E":"transparent",border:"2px solid "+(i<pinInput.length?"#C8A96E":"rgba(200,169,110,0.25)"),transition:"all 0.15s"}}))
          ),
          keypad,
          !ehNovo&&!temLegacy&&modo==="entrada"&&h("button",{onClick:()=>{setPinMode("esqueci");setPinErr("");setPinInput("");},style:{background:"none",border:"none",color:"#8A8070",fontSize:11,cursor:"pointer",textDecoration:"underline",marginTop:20}},"esqueci o PIN"),
          pinAttempts.n>0&&!bloqueado&&modo==="entrada"&&h("div",{style:{fontSize:10,color:"#E8C44A",marginTop:14,fontFamily:"monospace"}},"Tentativas erradas: "+pinAttempts.n+(pinAttempts.n>=3?" - 30min de bloqueio em "+(5-pinAttempts.n)+" tentativas":""))
        ),
        pinErr&&h("div",{style:{color:pinErr.includes("Validando")||pinErr.includes("Desbloqueando")||pinErr.includes("Configurando")?"#C8A96E":"#E05252",fontSize:11,marginTop:14,fontFamily:"monospace"}},pinErr)
      )
    );
  }

  return h("div",{style:{minHeight:"100vh",background:"#0D0F14",color:"#E8E2D5",fontFamily:"Georgia,serif",paddingBottom:80}},
    header,
    h("div",{style:{padding:"0 18px"}},tabs,content)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
