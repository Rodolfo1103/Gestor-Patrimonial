<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0D0F14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Portfolio Patrimonial</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:0;background:#0D0F14;color:#E8E2D5;font-family:Georgia,serif;overscroll-behavior:none;}
input,textarea{font-size:16px!important;}
::-webkit-scrollbar{width:0;}
.dot-pulse span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#C8A96E;margin:0 2px;animation:dp 1.2s ease-in-out infinite;}
.dot-pulse span:nth-child(2){animation-delay:.2s;}
.dot-pulse span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {createElement:h,useState,useEffect,useCallback,useRef,Fragment} = React;

const CL=[
  {id:"fii",      name:"FIIs Brasil",   emoji:"\u{1F3E2}",min:28,max:30,color:"#C8A96E"},
  {id:"acoes_br", name:"Acoes Brasil",  emoji:"\u{1F1E7}\u{1F1F7}",min:13,max:15,color:"#4CAF82"},
  {id:"acoes_ext",name:"Acoes Ext",     emoji:"\u{1F30D}",min:28,max:30,color:"#5B8FD4"},
  {id:"selic",    name:"Tesouro Selic", emoji:"\u{1F3E6}",min:5, max:8, color:"#9B9B9B",flex:true},
  {id:"ouro",     name:"Ouro",          emoji:"\u2728",   min:3, max:5, color:"#E8C44A"},
  {id:"bitcoin",  name:"Bitcoin",       emoji:"\u20BF",   min:3, max:5, color:"#F7931A"},
  {id:"infra",    name:"Fundos Infra",  emoji:"\u26A1",   min:5, max:7, color:"#A56FD4"},
];
const BASE={
  fii:["HGRU11","RBVA11","ALZR11","TRXF11","FIIB11","BTLG11","HGLG11","XPIN11","JFLL11","TEPP11","PVBI11","TGAR11","HSML11","XPML11","RECR11","KNHY11","KNUQ11","KNIP11","AFHI11"],
  acoes_br:["PSSA3","EGIE3","WEGE3","BBAS3","ITUB3","KLBN4","CXSE3","MULT3","CMIN3","FRAS3","TAEE11"],
  acoes_ext:["MSFT","APH","MU","AMAT","GOOGL","WM","O","BRKB","DHR","PH","LIN","ECL","ADBE","PEP","XOM","AOS","PANW","CTVA","SIE","SAP","NSIS_B","HLMA","KOG","GMEXICOB","ASML","ABBN","TSE8058","TSE8031","NDIA","REA","HKG0700","HKG1299","J36","HKG0001","HKG0087","WES"],
  selic:["SELIC2031"],ouro:["OURO_FISICO","AAAU"],bitcoin:["BTC"],infra:["BRZP11","AZIN11","KDIF11"],
};
const BLBL={SELIC2031:"Tesouro Selic 2031",OURO_FISICO:"Ouro Fisico Ourominas (g)",AAAU:"ETF AAAU",BTC:"Bitcoin",BRKB:"Berkshire Hathaway",NSIS_B:"Novozymes",HLMA:"Halma PLC",KOG:"Kongsberg Group",GMEXICOB:"Grupo Mexico",TSE8058:"Mitsubishi Corp",TSE8031:"Mitsui Co",REA:"REA Group",HKG0700:"Tencent Holdings",HKG1299:"AIA Group",J36:"Jardine Matheson",HKG0001:"CK Hutchison",HKG0087:"Swire Pacific",WES:"Wesfarmers"};
const BCCY={HGRU11:"BRL",RBVA11:"BRL",ALZR11:"BRL",TRXF11:"BRL",FIIB11:"BRL",BTLG11:"BRL",HGLG11:"BRL",XPIN11:"BRL",JFLL11:"BRL",TEPP11:"BRL",PVBI11:"BRL",TGAR11:"BRL",HSML11:"BRL",XPML11:"BRL",RECR11:"BRL",KNHY11:"BRL",KNUQ11:"BRL",KNIP11:"BRL",AFHI11:"BRL",PSSA3:"BRL",EGIE3:"BRL",WEGE3:"BRL",BBAS3:"BRL",ITUB3:"BRL",KLBN4:"BRL",CXSE3:"BRL",MULT3:"BRL",CMIN3:"BRL",FRAS3:"BRL",TAEE11:"BRL",MSFT:"USD",APH:"USD",MU:"USD",AMAT:"USD",GOOGL:"USD",WM:"USD",O:"USD",BRKB:"USD",DHR:"USD",PH:"USD",LIN:"USD",ECL:"USD",ADBE:"USD",PEP:"USD",XOM:"USD",AOS:"USD",PANW:"USD",CTVA:"USD",NDIA:"USD",SIE:"EUR",SAP:"EUR",ASML:"EUR",ABBN:"CHF",NSIS_B:"DKK",HLMA:"GBP",KOG:"NOK",GMEXICOB:"MXN",TSE8058:"JPY",TSE8031:"JPY",REA:"AUD",WES:"AUD",HKG0700:"HKD",HKG1299:"HKD",HKG0001:"HKD",HKG0087:"HKD",J36:"SGD",SELIC2031:"BRL",OURO_FISICO:"BRL",AAAU:"USD",BTC:"USD",BRZP11:"BRL",AZIN11:"BRL",KDIF11:"BRL"};
const VB=["SELIC2031"],GB=["OURO_FISICO"];
const FX={BRL:1,USD:5.8,EUR:6.3,GBP:7.3,CHF:6.5,JPY:0.038,AUD:3.7,HKD:0.74,SGD:4.3,DKK:0.84,NOK:0.55,MXN:0.29};
const RR={fii:{r:3.5,e:7.5},acoes_br:{r:6.5,e:8.5},acoes_ext:{r:5.5,e:8.0},selic:{r:1.0,e:4.5},ouro:{r:4.0,e:5.5},bitcoin:{r:9.5,e:9.0},infra:{r:2.5,e:7.0}};
const SK="pat-v9";
const ld=()=>{try{return JSON.parse(localStorage.getItem(SK)||"null");}catch{return null;}};
const sv=(d)=>{try{localStorage.setItem(SK,JSON.stringify(d));}catch{}};
const gk=()=>{try{return localStorage.getItem("pat-key")||"";}catch{return "";}};
const sk=(k)=>{try{localStorage.setItem("pat-key",k);}catch{}};
function mkL(cu){
  const ccy={...BCCY},cls={},lbl={...BLBL};
  Object.entries(BASE).forEach(([cid,ts])=>ts.forEach(t=>{cls[t]=cid;}));
  Object.entries(cu||{}).forEach(([cid,list])=>{(list||[]).forEach(a=>{ccy[a.ticker]=a.ccy||"BRL";cls[a.ticker]=cid;lbl[a.ticker]=a.label||a.ticker;});});
  return {ccy,cls,lbl};
}
function pv(t,p,ccy){
  if(!p)return 0;
  if(VB.includes(t))return p.totalBRL||0;
  if(GB.includes(t))return(p.qty||0)*(p.price||0);
  return(p.qty||0)*(p.price||0)*(FX[ccy[t]||"BRL"]||1);
}
function hq(t,p){if(!p)return false;if(VB.includes(t))return(p.totalBRL||0)>0;return(p.qty||0)>0;}
const fB=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fN=(v,d=2)=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=v=>(v||0).toFixed(1)+"%";
const pN=s=>parseFloat(String(s).replace(",","."))||0;

// Helper: create element shorthand
const d=(tag,props,...children)=>h(tag,props,...children);
const S=(style,...children)=>h("div",{style},...children);

async function callAI(messages,key,search){
  const body={model:"claude-sonnet-4-20250514",max_tokens:1500,messages};
  if(search)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  });
  const data=await r.json();
  if(data.error)throw new Error(data.error.message||data.error.type);
  return data.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
}

function KeyScreen({onSave}){
  const [v,sv]=useState("");
  return S({minHeight:"100vh",background:"#0D0F14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24},
    S({fontSize:40,marginBottom:16},"🔑"),
    h("h2",{style:{margin:"0 0 10px",fontSize:20,fontWeight:400,color:"#F0EAD8",textAlign:"center"}},"Chave da API Anthropic"),
    S({color:"#8A8070",fontSize:13,lineHeight:1.7,marginBottom:20,textAlign:"center",maxWidth:320},"Obtenha em ",h("span",{style:{color:"#C8A96E"}},"console.anthropic.com"),". Salva so neste dispositivo."),
    h("input",{type:"password",placeholder:"sk-ant-...",value:v,onChange:e=>sv(e.target.value),style:{width:"100%",maxWidth:320,background:"rgba(200,169,110,0.05)",border:"1px solid rgba(200,169,110,0.3)",borderRadius:8,padding:"12px 14px",color:"#F0EAD8",fontFamily:"monospace",outline:"none",marginBottom:10}}),
    h("button",{onClick:()=>v.startsWith("sk-")?onSave(v):alert("Chave invalida"),style:{width:"100%",maxWidth:320,padding:"13px",background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:8,color:"#0D0F14",fontSize:13,fontWeight:700,letterSpacing:2,textTransform:"uppercase",cursor:"pointer"}},"Salvar e continuar")
  );
}

function App(){
  const [apiKey,setApiKeyS]=useState(gk);
  const [tab,setTab]=useState("dashboard");
  const [port,setPort]=useState({});
  const [custom,setCustom]=useState({});
  const [hidden,setHidden]=useState([]);
  const [lastPU,setLastPU]=useState(null);
  const [loadP,setLoadP]=useState(false);
  const [pErr,setPErr]=useState("");
  const [editA,setEditA]=useState(null);
  const [eQty,setEQty]=useState("");
  const [ePrice,setEPrice]=useState("");
  const [showHid,setShowHid]=useState(false);
  const [addTo,setAddTo]=useState(null);
  const [nTick,setNTick]=useState("");
  const [nLbl,setNLbl]=useState("");
  const [nCcy,setNCcy]=useState("BRL");
  const [apV,setApV]=useState("");
  const [apR,setApR]=useState(null);
  const [loadA,setLoadA]=useState(false);
  const [execE,setExecE]=useState({});
  const [step,setStep]=useState("r");
  const [hist,setHist]=useState([]);
  const [aErr,setAErr]=useState("");
  const [chatM,setChatM]=useState([]);
  const [chatIn,setChatIn]=useState("");
  const [chatL,setChatL]=useState(false);
  const [inited,setInited]=useState(false);

  useEffect(()=>{
    const dd=ld();
    if(dd){setPort(dd.port||{});setCustom(dd.custom||{});setHidden(dd.hidden||[]);setLastPU(dd.lastPU||null);setHist(dd.hist||[]);
      Object.entries(dd.custom||{}).forEach(([,list])=>{(list||[]).forEach(a=>{BCCY[a.ticker]=a.ccy||"BRL";});});
    }
    setInited(true);
  },[]);
  useEffect(()=>{if(!inited)return;sv({port,custom,hidden,lastPU,hist});},[port,custom,hidden,lastPU,hist,inited]);

  const L=useCallback(()=>mkL(custom),[custom]);
  const {ccy,cls,lbl}=L();
  const allT=useCallback((cid)=>[...(BASE[cid]||[]),...(custom[cid]||[]).map(a=>a.ticker)],[custom]);

  const stats=useCallback(()=>{
    let total=0;const ct={};CL.forEach(c=>{ct[c.id]=0;});
    Object.entries(port).forEach(([t,p])=>{const v=pv(t,p,ccy);if(!v)return;total+=v;const cid=p.classId||cls[t];if(cid)ct[cid]=(ct[cid]||0)+v;});
    const cw={};CL.forEach(c=>{cw[c.id]=total>0?(ct[c.id]/total)*100:0;});
    return {total,ct,cw};
  },[port,ccy,cls]);
  const {total,ct,cw}=stats();
  const hasPos=Object.entries(port).some(([t,p])=>hq(t,p));

  const refresh=useCallback(async()=>{
    const tickers=Object.keys(port).filter(t=>hq(t,port[t]));
    if(!tickers.length){setPErr("Nenhum ativo com quantidade cadastrada");return;}
    setLoadP(true);setPErr("");
    try{
      const allPrices={};
      for(let i=0;i<tickers.length;i+=6){
        const batch=tickers.slice(i,i+6);
        const msg="Busque o preco de fechamento mais recente de cada ativo: "+batch.join(",")+" . Responda SOMENTE um objeto JSON assim: {\"HGRU11\":127.50,\"BTLG11\":105.30} sem texto adicional.";
        const txt=await callAI([{role:"user",content:msg}],apiKey,true);
        const m=txt.match(/\{[^{}]+\}/);
        if(m){try{const p=JSON.parse(m[0]);Object.entries(p).forEach(([t,v])=>{if(typeof v==="number"&&v>0)allPrices[t]=v;});}catch{}}
      }
      const n=Object.keys(allPrices).length;
      if(n>0){setPort(prev=>{const np={...prev};Object.entries(allPrices).forEach(([t,v])=>{if(np[t])np[t]={...np[t],price:v};});return np;});setLastPU(new Date().toISOString());}
      else setPErr("API nao retornou precos. Tente novamente.");
    }catch(e){setPErr(e.message||"Erro");}
    setLoadP(false);
  },[port,apiKey]);

  const openEdit=(ticker,classId)=>{
    const p=port[ticker]||{};setEditA({ticker,classId});
    if(VB.includes(ticker)){setEQty(p.totalBRL!=null?String(p.totalBRL):"");setEPrice("");}
    else{setEQty(p.qty!=null?String(p.qty):"");setEPrice(p.price!=null?String(p.price):"");}
  };
  const saveEdit=()=>{
    if(!editA)return;const{ticker,classId}=editA;
    if(VB.includes(ticker)){const v=pN(eQty);setPort(prev=>({...prev,[ticker]:{...prev[ticker],classId,totalBRL:v,qty:1,price:v}}));}
    else{const qty=pN(eQty),price=pN(ePrice);setPort(prev=>({...prev,[ticker]:{...prev[ticker],classId,qty,price}}));}
    setEditA(null);
  };
  const removePos=t=>{setPort(prev=>{const n={...prev};delete n[t];return n;});setEditA(null);};
  const toggleHide=t=>{setHidden(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t]);setEditA(null);};
  const addCustom=cid=>{
    const t=nTick.trim().toUpperCase();if(!t)return;
    if(allT(cid).includes(t)){alert("Ja existe");return;}
    setCustom(prev=>({...prev,[cid]:[...(prev[cid]||[]),{ticker:t,label:nLbl.trim()||t,ccy:nCcy}]}));
    BCCY[t]=nCcy;setAddTo(null);setNTick("");setNLbl("");setNCcy("BRL");
  };
  const removeCustom=(cid,t)=>{setCustom(prev=>({...prev,[cid]:(prev[cid]||[]).filter(a=>a.ticker!==t)}));removePos(t);};

  const genAlloc=async()=>{
    const v=pN(apV);if(v<=0)return;
    setLoadA(true);setAErr("");
    try{
      const ci=CL.map(c=>({id:c.id,name:c.name,min:c.min,max:c.max,peso:cw[c.id]||0,
        ativos:allT(c.id).map(t=>{const p=port[t],cc=ccy[t]||"BRL";
          if(VB.includes(t))return{ticker:t,moeda:"BRL",valorBRL:p?.totalBRL||0};
          if(GB.includes(t))return{ticker:t,moeda:"BRL/g",valorBRL:(p?.qty||0)*(p?.price||0)};
          return p?{ticker:t,moeda:cc,qtd:p.qty,preco:p.price||0,valorBRL:(p.qty||0)*(p.price||0)*(FX[cc]||1)}:{ticker:t,moeda:cc};
        }).slice(0,7)
      }));
      const msg="Analista Buy&Hold aposentadoria rigoroso. PORTFOLIO:"+JSON.stringify(ci)+"\nAPORTE:R$"+v+"\nRegras: zero vendas, todas 7 classes recebem min 2%, priorizar classes abaixo do alvo. FIIs: P/VPA<=0.97 DY>=9%. Ciclicas: P/L<=10x. Compounders: P/L<=18x. Exterior value: P/L<=18x. Infra: DY>=9.5%.\nJSON sem markdown: {\"resumo\":\"...\",\"alertas\":[],\"classes\":[{\"id\":\"fii\",\"pct\":25,\"valor\":2500,\"justificativa\":\"...\",\"ativos\":[{\"ticker\":\"HGLG11\",\"score\":\"COMPRA FORTE\",\"metricas\":\"P/VPA 0.91\",\"margem\":\"...\",\"obs\":\"...\"}]}]}";
      const txt=await callAI([{role:"user",content:msg}],apiKey,false);
      const res=JSON.parse(txt);
      setApR({...res,apValue:v});setStep("r");
      const ent={};(res.classes||[]).forEach(cl=>(cl.ativos||[]).forEach(a=>{ent[a.ticker]={qty:"",price:port[a.ticker]?.price?String(port[a.ticker].price):"",done:false};}));
      setExecE(ent);
    }catch(e){setAErr(e.message||"Erro");}
    setLoadA(false);
  };

  const applyExec=()=>{
    const buys=Object.entries(execE).filter(([,v])=>v.done&&pN(v.qty)>0&&pN(v.price)>0);
    if(!buys.length)return;
    setPort(prev=>{const n={...prev};buys.forEach(([t,v])=>{const aq=pN(v.qty),ap=pN(v.price),cid=cls[t]||n[t]?.classId,old=n[t]||{};n[t]={...old,classId:cid,qty:(old.qty||0)+aq,price:ap};});return n;});
    setHist(prev=>[{date:new Date().toISOString(),apValue:apR.apValue,purchases:buys.map(([t,v])=>({ticker:t,qty:pN(v.qty),price:pN(v.price),total:pN(v.qty)*pN(v.price)})),totalExecuted:buys.reduce((s,[,v])=>s+pN(v.qty)*pN(v.price),0)},...prev].slice(0,24));
    setStep("done");
  };

  const sendChat=async msg=>{
    if(!msg.trim())return;
    setChatM(prev=>[...prev,{role:"user",content:msg}]);setChatIn("");setChatL(true);
    const portCtx=Object.entries(port).filter(([t,p])=>pv(t,p,ccy)>0).map(([t,p])=>({t,cls:cls[t],v:Math.round(pv(t,p,ccy))})).sort((a,b)=>b.v-a.v).slice(0,10);
    const allocCtx=apR?{valor:apR.apValue,resumo:apR.resumo}:null;
    const h8=chatM.slice(-8);
    const prompt="Analista patrimonial senior Buy&Hold aposentadoria. PORTFOLIO:"+JSON.stringify(portCtx)+(allocCtx?"\nULTIMA ANALISE:"+JSON.stringify(allocCtx):".")+"\nResponda direto, max 4 paragrafos.\nHistorico:\n"+h8.map(m=>(m.role==="user"?"Investidor: ":"Analista: ")+m.content).join("\n")+"\nPergunta: "+msg;
    try{
      const txt=await callAI([{role:"user",content:prompt}],apiKey,false);
      setChatM(prev=>[...prev,{role:"assistant",content:txt}]);
    }catch(e){setChatM(prev=>[...prev,{role:"assistant",content:"Erro: "+e.message}]);}
    setChatL(false);
  };

  if(!apiKey)return h(KeyScreen,{onSave:k=>{sk(k);setApiKeyS(k);}});
  if(!inited)return S({minHeight:"100vh",background:"#0D0F14",display:"flex",alignItems:"center",justifyContent:"center"},S({color:"#C8A96E",fontFamily:"monospace",letterSpacing:3},"CARREGANDO..."));

  // Header
  const header=S({background:"linear-gradient(180deg,rgba(200,169,110,0.08) 0%,transparent 100%)",borderBottom:"1px solid rgba(200,169,110,0.15)",padding:"14px 18px 10px"},
    S({fontSize:9,letterSpacing:4,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:2},"Planejamento Patrimonial - Buy & Hold"),
    S({display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:8,flexWrap:"wrap"},
      S({},
        h("h1",{style:{margin:0,fontSize:20,fontWeight:400,color:"#F0EAD8"}},"Portfolio Patrimonial"),
        hasPos&&S({fontSize:24,color:"#C8A96E",fontFamily:"monospace",marginTop:2,fontWeight:700},fB(total))
      ),
      hasPos&&h("button",{onClick:refresh,disabled:loadP,style:{background:"rgba(200,169,110,0.1)",border:"1px solid rgba(200,169,110,0.3)",borderRadius:6,padding:"6px 12px",color:"#C8A96E",fontSize:10,fontFamily:"monospace",letterSpacing:2,cursor:"pointer",textTransform:"uppercase"}},loadP?"Buscando...":"Atualizar precos")
    ),
    (lastPU||pErr)&&S({fontSize:9,color:"#5A5550",marginTop:3,fontFamily:"monospace"},
      lastPU&&("Atualizado: "+new Date(lastPU).toLocaleString("pt-BR")+" · USD "+FX.USD.toFixed(2)),
      pErr&&h("span",{style:{color:"#E05252",marginLeft:8}},"Erro: "+pErr)
    )
  );

  // Tabs
  const tabs=S({display:"flex",borderBottom:"1px solid rgba(255,255,255,0.06)",marginBottom:18,marginTop:10,overflowX:"auto"},
    ...[{id:"dashboard",label:"Dashboard"},{id:"positions",label:"Posicoes"},{id:"aporte",label:"Aporte"},{id:"chat",label:"Analise"},{id:"history",label:"Historico"}].map(t=>
      h("button",{key:t.id,onClick:()=>{setTab(t.id);if(t.id!=="aporte"){setApR(null);setStep("r");}},style:{background:"none",border:"none",borderBottom:tab===t.id?"2px solid #C8A96E":"2px solid transparent",color:tab===t.id?"#C8A96E":"#8A8070",padding:"6px 10px",cursor:"pointer",fontSize:12,marginBottom:-1,flexShrink:0,whiteSpace:"nowrap"}},t.label)
    ),
    h("button",{onClick:()=>{if(window.confirm("Alterar chave?")){localStorage.removeItem("pat-key");setApiKeyS("");}},style:{marginLeft:"auto",background:"none",border:"none",color:"#3A3830",fontSize:10,cursor:"pointer",padding:"6px 0",fontFamily:"monospace",flexShrink:0}},"API")
  );

  let content=null;

  if(tab==="dashboard"){
    if(!hasPos){
      content=S({textAlign:"center",padding:"46px 14px"},S({fontSize:34,marginBottom:12},"📋"),S({color:"#8A8070",fontSize:12,lineHeight:1.7,marginBottom:16,fontStyle:"italic"},"Nenhuma posicao cadastrada."),h("button",{onClick:()=>setTab("positions"),style:{background:"linear-gradient(135deg,#C8A96E,#A8893E)",border:"none",borderRadius:6,padding:"10px 22px",color:"#0D0F14",fontSize:12,fontWeight:700,cursor:"pointer"}},"Cadastrar posicoes"));
    } else {
      // Composition bar
      const compBar=S({marginBottom:18},
        S({fontSize:9,letterSpacing:3,color:"#C8A96E",fontFamily:"monospace",textTransform:"uppercase",marginBottom:7},"Composicao atual"),
